    The thesis states reach is part of the product and that small/new accounts must have
    a credible path to an audience. Meeting that requires at least one mechanism
    grounded in real distribution data. Currently zero such mechanisms exist.
  persona_impact:
    power_migrant: "This is the entire reason they would switch. Its absence means there is no wedge — the product is a nicer editor, not a growth system."
    casual_operator: "Follows the score to 90+, posts, reaches nobody, and concludes the product does not work. The score's authority makes the disappointment worse."
  severity: BLOCKER
  blast_radius: ["P1", "P2", "P3", "P8"]
  effort: XL
  effort_reasoning: "This is the product's central promise and is currently unimplemented in every mechanism. It cannot be closed by polish; it needs a real signal source and a working loop. Sizing it honestly: this is the single largest gap in the audit."
