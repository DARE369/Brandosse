    - "Live query 2026-08-20: ghost_slots Content-Range: */0 (0 rows)"
    - "supabase/functions/daily-analysis/index.ts:130-141 (posts.length < 5 guard, and platformPosts.length < 5 guard, per platform)"
    - "supabase/functions/daily-analysis/index.ts:238-241 (ghost slots skipped entirely if calendar_settings.ghost_slots_enabled is falsy)"
  observed_behavior: >
    Despite the daily-analysis pipeline demonstrably running every day (see
    P8-002), both `optimal_posting_times` and `ghost_slots` are completely
    empty live (0 rows each). This is consistent with ground truth's separate
    finding of only 9 published posts system-wide across all users -- far
    below the >=5-published-posts-per-platform gate at index.ts:130 and the
    >=5-filtered-platform-posts gate at index.ts:141 that
    analyzeUserOptimalTimes() requires before it writes anything, and
    generateGhostSlotsForUser() additionally requires
    calendar_settings.ghost_slots_enabled=true (index.ts:232-241) which may be
    off by default. The net effect: the ONLY part of this pipeline that
    unconditionally writes regardless of real data volume is the fabricated
    trending_topics path (P8-001) -- the two paths that COULD have been real
    (optimal times / ghost slots, both gated on genuine published-post
    engagement data) never produce output because there isn't enough real
    data, while the fabricated path runs anyway because it has no such gate.
