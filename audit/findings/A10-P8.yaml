- finding_id: P8-006
  pillar: P8
  capability: "attribution chain: generations -> posts -> external_post_id -> metrics -- breaks at the last hop, permanently"
  status: MISSING
  maturity: L0
  evidence:
    - "supabase/functions/publish-post/index.ts:212 (external_post_id := result.platformPostId written on successful publish -- confirms the chain DOES get an external post id up to this point)"
    - "grep 'platform_analytics' across all .ts/.tsx/.js/.jsx/.sql/.py in the repo: only 3 hits -- supabase/migrations/20260227090000_calendar_library_alignment.sql (adds an FK constraint, does not write rows), supabase/functions/daily-analysis/index.ts (READS via join at index.ts:120, never inserts), src/services/OptimalTimesService.js (READS via join at line 30, never inserts, and is dead code per P8-003)"
    - "supabase/migrations/20260227090000_calendar_library_alignment.sql:211-215 (platform_analytics.post_id FK -> posts.id ON DELETE SET NULL -- proves the schema was designed to carry metrics per-post, but nothing populates it)"
    - "Live query 2026-08-20: platform_analytics Content-Range: */0 (0 rows)"
    - "find supabase/functions -maxdepth 1 -type d | grep -iE 'metric|analytic|insight|engagement|stat' -- no matching edge function exists"
    - "grep for platform_analytics/graph.facebook/insights across video-worker/ (Python) -- no matches"
  observed_behavior: >
    The ID chain generations -> posts -> external_post_id is real and does get
    populated on a successful publish (publish-post/index.ts:212). But the
    final hop -- external_post_id -> real engagement metrics -- does not
    exist anywhere in this codebase. No edge function, cron job, worker, or
    script ever calls a platform API (Meta Graph API insights, TikTok
    analytics API, YouTube Analytics API, etc.) to fetch views/likes/
    comments/shares for a published post and write them into
    platform_analytics. The table's only FK and only join references treat it
    as a read source that is assumed to be populated by something -- that
    something was never built. Combined with P8-001 (trending_topics is 100%
    fabricated) and the live confirmation that platform_analytics has 0 rows,
    this settles the audit's decisive question: THERE IS NO REAL ENGAGEMENT
    DATA ANYWHERE IN THIS SYSTEM. Every table designed to hold real
    performance signal (platform_analytics, analytics_summary) is empty; the
    one table that is populated (trending_topics) is 100% hardcoded fake data
    written by a job the system's own monitoring can't see (P8-002).
  expected_behavior: >
    A functioning analytics feature requires, at minimum, a scheduled job that
    calls each connected platform's insights/analytics API for every published
    post's external_post_id and upserts the result into platform_analytics.
    This does not exist even as a stub -- it is a fully MISSING capability,
    not a broken one.
  persona_impact:
    power_migrant: "This is disqualifying. Every competitor (Buffer, Later, Hootsuite) leads with real post-level engagement metrics; a product with literally zero real engagement data anywhere is not in the same category."
    casual_operator: "Sees no engagement numbers at all on the Analytics page (confirmed in P8-011/page trace) so at least isn't actively misled by a fake number here -- but has no way to know if their content is actually working."
  severity: BLOCKER
  blast_radius: ["P1", "P2", "P3"]
  effort: XL
  effort_reasoning: "Requires building OAuth-scoped metrics fetchers per platform (Meta Graph API, TikTok, YouTube Analytics, etc.), a scheduled sync job, rate-limit handling, and backfill -- a multi-week project per platform, compounded by the fact that only 1 of 22 connected accounts (TikTok via Zernio) is even a real, working connection to fetch from."
  confidence: HIGH
  unverified_notes: ""
  trace_id: "T-P8-01"
  source_agent: "A10"

