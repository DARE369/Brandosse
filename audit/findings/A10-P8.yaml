    honest low-confidence label, or show an explicit empty-state ("not enough
    published posts yet") in any UI surface that would consume these tables --
    but no UI surface in src/pages/AnalyticsPage or app/app/analytics
    reads optimal_posting_times, ghost_slots, or trending_topics at all (see
    P8-007), so this emptiness is currently invisible rather than surfaced.
