- finding_id: P8-001
  pillar: P8
  capability: "trending_topics data source (daily-analysis edge function)"
  status: STUBBED
  maturity: L1
  evidence:
    - "supabase/functions/daily-analysis/index.ts:337-372"
    - "supabase/functions/daily-analysis/index.ts:340-341"
  observed_behavior: >
    The `updateTrendingTopics()` function (index.ts:337-372) writes a hardcoded
    JS constant `mockTrends` (index.ts:346-365) into the `trending_topics` table
    via `.upsert(mockTrends)` (index.ts:367), once per platform (instagram,
    tiktok, youtube, facebook). The array contains exactly two fixed entries
    every single invocation: topic "AI Tools" (trend_score: 95, category "Tech")
    and topic "Content Creation Tips" (trend_score: 88, category "Education"),
    both stamped `source: 'manual'` and `valid_until: now + 24h`. The code's own
    comment admits this: "In production, you'd call actual trend APIs here. For
    now, using mock data or Groq analysis" (index.ts:340-341) — but no Groq call
    or any external HTTP call exists anywhere in this file. This is not a
    labeled placeholder in the UI — the row's `source` field says 'manual', not
    'mock' or 'fake', so any downstream consumer displaying `source` would
    represent it as legitimate curation.

    LIVE-DB CONFIRMATION (read-only query, 2026-08-20): `trending_topics` holds
    exactly 1200 rows. `select=source&limit=1000` shows source='manual' on all
    1000 sampled rows (100%) — zero rows from any other pipeline. A
    created_at.desc sample of the 20 newest rows shows entries today at
    2026-08-20T02:00:07 and yesterday at 2026-08-19T02:00:04, and the oldest 5
    rows (created_at.asc) are from 2026-03-24T02:00:15 — i.e. this exact
    fabrication has been running once a day, every day, at ~2AM UTC, for
    roughly 5 months straight (149 days x 8 rows/day [2 topics x 4 platforms]
    ≈ 1192, matching the 1200 total). Every sampled row's `topic` is one of
    exactly two literal strings: "AI Tools" or "Content Creation Tips" — this
    is not a stale one-time seed, it is a live, continuously-operating
    fabrication pipeline that has been overwriting/appending fake "trend"
    data into a user-facing table daily since March 2026.
  expected_behavior: >
    "Trending topics" implies real platform trend data (from a trends API, a
    scraper, or at minimum an LLM call grounded in real signals). A competitor's
    trending-topics feature pulls from actual platform/category signals, not two
    static strings hardcoded at build time.
  persona_impact:
    power_migrant: "Would recognize instantly that 'AI Tools' / 'Content Creation Tips' never change and treat any trend-based suggestion as fake, destroying trust in every other analytics number on the page."
    casual_operator: "Has no way to know the trend is fabricated — sees 'AI Tools' recommended as trending and may act on stale/generic advice weeks after it was 'discovered', believing it's live data."
  severity: BLOCKER
  blast_radius: ["P1", "P2", "P3"]
  effort: L
  effort_reasoning: "Requires integrating a real trends data source (platform API or licensed trend feed), a migration to dedupe/purge ~1200 fabricated rows accumulated over 5 months, and unscheduling/rewriting the cron job; not a quick patch."
  confidence: HIGH
  unverified_notes: ""
  trace_id: "T-P8-01"
  source_agent: "A10"

- finding_id: P8-002
  pillar: P8
  capability: "daily-analysis cron scheduling -- CORRECTS shared ground truth: the job DOES run"
  status: STUBBED
  maturity: L2
  evidence:
    - "supabase/functions/daily-analysis/index.ts:337-372 (updateTrendingTopics, the fabrication path)"
    - "Live query 2026-08-20: get_cron_job_status() RPC returns EXACTLY 3 jobs (process-scheduled-posts, process-risk-alerts, credit-monthly-reset) -- daily-analysis/trending-topics job is absent from this RPC's output"
    - "Live query 2026-08-20: trending_topics row timestamps (created_at.desc) show fresh inserts today (2026-08-20T02:00:07) and yesterday (2026-08-19T02:00:04); oldest rows (created_at.asc) are 2026-03-24T02:00:15 -- a daily ~2AM UTC cadence matching the pg_cron comment block's '0 2 * * *' schedule (index.ts:384) exactly, running continuously for ~5 months"
  observed_behavior: >
    CORRECTION TO SHARED GROUND TRUTH: the brief states "daily-analysis is NOT
    scheduled and therefore never runs," sourced from get_cron_job_status()
    returning only 3 named jobs. Live data DISPROVES this for at least the
    trending_topics write path: rows are inserted every single day at ~2AM UTC
    on a schedule that exactly matches the '0 2 * * *' cron expression
    documented in the function's own comment block (index.ts:383-393), and has
    been running since 2026-03-24 (~5 months, ~1200 accumulated rows). This
    means EITHER (a) get_cron_job_status() is an incomplete view -- it may only
    surface a hardcoded allowlist of job names rather than the full
    `cron.job` table, so a 4th live job (e.g. the SQL comment's own
    'daily-calendar-analysis' name) is invisible to it, or (b) some other
    external scheduler (Vercel cron, GitHub Actions, uptime-monitor-as-cron)
    hits this edge function's HTTP endpoint daily. Either way, the pipeline
    that also drives `optimal_posting_times` and `ghost_slots`
    (analyzeUserOptimalTimes / generateGhostSlotsForUser, index.ts:109-324)
    is being invoked daily by SOMETHING -- yet optimal_posting_times has 0
    live rows and ghost_slots has 0 live rows (both confirmed empty in this
    audit's own live queries, see P8-006). That is only explicable if
    analyzeUserOptimalTimes/generateGhostSlotsForUser are silently no-op'ing
    for every user (most likely because `profiles.status='active'` matches
    zero/few rows, or because ghost_slots_enabled is false for all users, or
    because the <5-published-posts-per-platform guard at index.ts:130/141
    always trips given the live reality of only 9 published posts across the
    whole system) while updateTrendingTopics() -- which has no such gate --
    runs unconditionally and keeps writing fake rows regardless.
  expected_behavior: >
    A monitoring/cron-status RPC that claims to enumerate scheduled jobs
    should enumerate ALL scheduled jobs, not a hardcoded subset -- any
    dashboard or audit relying on get_cron_job_status() to assess "what runs
    in this system" will silently miss jobs, which is itself a monitoring
    integrity gap. Separately, the trending-topics fabrication should never
    run at all, scheduled or not.
  persona_impact:
    power_migrant: "Would immediately distrust the whole analytics/insights surface on discovering a 5-month-old silently-running fake-data cron untracked by the system's own cron monitor."
    casual_operator: "Never sees this directly, but is the one whose optimal_posting_times/ghost_slots silently never populate while trending_topics keeps polluting with fake entries -- an invisible, asymmetric failure."
  severity: BLOCKER
  blast_radius: ["P1", "P2", "P3"]
  effort: M
  effort_reasoning: "Locating the actual live cron/trigger mechanism (outside get_cron_job_status()'s visibility) requires DB-admin access this audit doesn't have (read-only); disabling it once found is small, but see P8-001 for the full fix."
  confidence: HIGH
  unverified_notes: "Could not directly query pg_catalog.cron.job or the Supabase dashboard's cron UI (read-only REST access only) to name the actual job/trigger responsible; inferred from the exact 2AM UTC daily cadence matching the code's own documented schedule."
  trace_id: "T-P8-01"
  source_agent: "A10"

- finding_id: P8-003
