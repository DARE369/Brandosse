- finding_id: P3-001
  pillar: P3
  capability: "LLM provider routing (Groq-primary / Claude-fallback) for content-plan generation"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "supabase/functions/_shared/llm.ts:38-67"          # resolveProviders — orders [groq, anthropic] when preferred=groq
    - "supabase/functions/generate-content-plan/index.ts:194-217" # generatePlan() calls callLlm with preferredProvider:'groq'
    - "supabase/functions/generate-content-plan/index.ts:219-246" # revisePlan() same
    - "LIVE DB: content_plans.plan_provider, ordered by created_at desc, limit 20 (queried 2026-08-20 via read-only REST) — the 16 most recent rows (2026-08-18T10:28 through 2026-08-20T14:34) are ALL plan_provider='anthropic'; the last plan_provider='groq' row is 2026-08-06T12:41. Across all 54 rows: {anthropic:16, groq:13, null:25(pre-tracking)}."
  observed_behavior: "The code explicitly prefers Groq (cheap, fast Llama-3.3-70B) for the primary content-plan LLM call and only falls back to Anthropic Claude on Groq failure (llm.ts:172-189, catch-and-continue). Live data shows Groq has served ZERO of the last 16 consecutive content-plan generations over more than 2 days (2026-08-18 to 2026-08-20) — every single one silently fell back to Claude Sonnet 4.6. Groq worked as recently as 2026-08-06. Because the fallback succeeds, no error is ever surfaced to the user or logged anywhere the developer would see it (no alerting on fallback rate) — the failure is only visible by querying the DB directly, which is how this was found."
  expected_behavior: "A competitor-grade provider-routing layer would alert/log when the intended-primary provider fails 100% of the time for 2+ days, and/or have a health check. The architected cost model (cheap Groq primary, expensive Claude only as an emergency fallback) is currently fully inverted in production with nobody aware."
  persona_impact:
    power_migrant: "Doesn't notice directly — output quality is fine (Claude is the stronger model) — but this is exactly the kind of silent infra rot that erodes trust once discovered, and it directly echoes the prior 'placeholder GROQ key broke session naming' incident class the codebase has already been burned by once."
    casual_operator: "No visible impact today since generation still works and reads as high quality — the risk is entirely on the business side (cost), not the user-facing experience."
  severity: MAJOR
  blast_radius: ["P3"]
  effort: S
  effort_reasoning: "Root cause unconfirmed from code alone (needs checking the live GROQ_API_KEY secret / whether 'llama-3.3-70b-versatile' was deprecated on Groq's side around 2026-08-18) — but once diagnosed the fix is a secret rotation or model-id swap, plus adding a fallback-rate log/alert (S-M for the alerting piece)."
  confidence: HIGH
  unverified_notes: "Root cause of the Groq failure (invalid/expired key vs. model deprecation vs. Groq outage) is NOT verified — no access to Supabase edge function secrets or Groq-side logs from this audit. The FACT of 100% fallback since 2026-08-18 is HIGH confidence (direct DB query, 16/16 consecutive rows)."
  trace_id: "T-P3-01"
  source_agent: "A4"

- finding_id: P3-002
  pillar: P3
  capability: "Timeout handling on primary text-generation LLM calls"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "supabase/functions/_shared/llm.ts:69-113"   # callAnthropic — fetch() has no signal/timeout
    - "supabase/functions/_shared/llm.ts:115-147"  # callOpenAiCompatible — fetch() has no signal/timeout
    - "supabase/functions/_shared/llm.ts:215-239"  # callVisionJudge DOES set signal: AbortSignal.timeout(20_000) — contrast
    - "supabase/functions/_shared/llm.ts:280-313"  # callAnthropicWithDocument DOES set signal: AbortSignal.timeout(100_000) — contrast
  observed_behavior: "callLlm() — used by generate-content-plan, generate-post-metadata, generate-caption, and ai-brand-consistency-check, i.e. every TEXT generation path — has no client-side timeout on either provider's fetch() call. If Groq or Anthropic hangs (rather than erroring fast), the request blocks until the Supabase edge function's own platform-level wall-clock limit kills it, rather than failing fast into the same-request Anthropic fallback within a controlled window. The two specialist functions in the same file (callVisionJudge, callAnthropicWithDocument) both got explicit AbortSignal.timeout() after a prior documented incident (extractBrandKit truncation) — that lesson was not applied to the primary callLlm() path all TEXT generation depends on."
  expected_behavior: "Every outbound LLM call should have an explicit timeout well under the platform's hard limit, so a hung provider triggers the SAME-request fallback to the second provider instead of guaranteeing the whole request fails."
  persona_impact:
    power_migrant: "A hung Groq/Anthropic call mid-generation reads as the app being frozen/broken rather than a fast, clean 'switched providers' recovery — the exact class of reliability rough edge that makes a power user distrust a tool under real load."
    casual_operator: "Sees a stuck spinner with no feedback for however long the platform-level timeout takes to fire, worse than a quick error + retry prompt."
  severity: MAJOR
  blast_radius: ["P3"]
  effort: XS
  effort_reasoning: "Add `signal: AbortSignal.timeout(N)` to the two fetch() calls in callAnthropic/callOpenAiCompatible — same pattern already used elsewhere in the same file."
  confidence: HIGH
  unverified_notes: ""
  trace_id: "T-P3-01"
  source_agent: "A4"

