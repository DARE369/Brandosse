- finding_id: P1-003
  pillar: P1
  capability: "client-side fallback tier for prompt suggestions"
  status: STUBBED
  maturity: L2
  evidence:
    - "src/services/groqClient.js:7-8 — 'const BROWSER_GROQ_TOKEN = ''; const GROQ_TOKEN = BROWSER_GROQ_TOKEN;' (hardcoded empty, with a comment: 'Browser-exposed provider keys are intentionally disabled')"
    - "src/services/groqClient.js:154-164,221-224 — hasGroq() is always false, so providerOrder() is always [], so callWithFailover always throws synchronously: 'No browser LLM provider is configured...'"
    - "src/services/suggestedPrompts.js:61-69 (generateSuggestedPrompts) — 3-tier chain: edge fn -> getGroqFallbackPrompts() -> buildLastResortPrompts(); tier 2 (getGroqFallbackPrompts, lines 113-126) calls callGroqJSON, which per above always throws and is caught at line 123 returning [] silently"
    - "src/services/suggestedPrompts.js:177-188 (buildLastResortPrompts) — 4 literal hardcoded template strings with a Date.now()-derived numeric suffix appended, not AI-generated at all"
    - "src/services/suggestedPrompts.js:190-193 (clearSuggestionsCache) removes key 'socialai_suggestions_${userId}_${mode}', but the actual stored key at line 29 is 'socialai_suggestions_${userId}_${mode}_${today}' — the two never match, so this function is a permanent no-op; grep confirms it also has zero callers anywhere in src/"
  observed_behavior: "The documented 3-tier resilience design (edge function -> browser Groq -> hardcoded last resort) is actually 2-tier in practice: the middle tier is dead code that always no-ops due to a hardcoded empty API key. When the edge function is unavailable or rate-limited, users silently get 4 literal, non-AI, template strings with a number appended, indistinguishable in the UI from real AI suggestions. The cache-invalidation utility is separately broken (wrong key) and unused."
