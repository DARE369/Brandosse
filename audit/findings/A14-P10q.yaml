- finding_id: P10q-004
  pillar: P10
  capability: "error swallowing — measured, and NOT the problem it was assumed to be"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "grep across src/** and supabase/functions/**: exactly 1 empty catch block (src/services/calendarAIService.js)"
    - "21 instances of .catch(() => {}) across 17 files, all in src/components and src/pages"
    - "grep of those 21 filtered for credit|publish|payment|stripe|paystack|refund|deduct: ZERO matches"
    - "representative samples: src/components/video-engine/ClipPreviewModal.jsx:47 (videoRef.play() autoplay rejection), src/components/User/UserSidebar.jsx:135 (background complaint fetch), src/components/User/UserNavbar.jsx:466 (mark-notification-viewed)"
  observed_behavior: >
    This finding CORRECTS an assumption the audit was carrying. Error swallowing was
    expected to be widespread on critical paths given the number of silent failures
    found elsewhere. It is not. There is exactly ONE empty catch block in the entire
    codebase, and all 21 .catch(() => {}) swallows are in UI components handling
    genuinely ignorable rejections — browser autoplay policy rejections, background
    notification fetches, and non-blocking refreshes.
    ZERO swallows sit on money, publish, credit, or data-write paths.
    The silent failures documented elsewhere in this audit (Groq 100% failure, frozen
    posts, fabricated trends, mock defaults) are therefore NOT caused by swallowed
    exceptions. They are caused by the absence of monitoring and by fail-open defaults.
    That is a different root cause requiring a different fix, and getting it right
    matters: adding error handling would not have prevented a single one of them.
  expected_behavior: >
    Swallowed rejections on ignorable UI operations are acceptable practice. The single
    empty catch block should be reviewed. No systemic remediation is warranted here.
  persona_impact:
    power_migrant: "No impact — these swallows are invisible and correct."
    casual_operator: "No impact."
  severity: MINOR
  blast_radius: []
  effort: XS
  effort_reasoning: "Review one empty catch block. The broader class needs no work."
  confidence: HIGH
  unverified_notes: "Catch blocks that log-and-continue (rather than being empty) were not exhaustively classified; some may swallow meaningfully while appearing handled. A full pass would need to read each catch body."
  trace_id: "T-P10q-04"
  source_agent: "A14/orchestrator"

- finding_id: P10q-005
  pillar: P10
  capability: "missing timeouts on outbound provider calls — including the sole publishing provider"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "supabase/functions/_shared/zernio.service.ts: 4 fetch call sites, 0 using AbortSignal or signal:"
    - "supabase/functions/_shared/fal.service.ts: 7 fetch call sites, 1 using AbortSignal"
    - "supabase/functions/_shared/llm.ts: 5 fetch call sites, 3 using AbortSignal"
    - "across supabase/functions/**: 29 fetch call sites, only 2 files reference AbortSignal/AbortController at all"
  observed_behavior: >
    Timeout coverage is inconsistent and worst where it matters most.
    zernio.service.ts — the ONLY real publishing provider in the product (publish-post
    routes every non-mock account through it) — has FOUR outbound calls and NOT ONE
    timeout. A hung or slow Zernio response has nothing to bound it. Because
    publish-post sets posts.status='publishing' BEFORE calling the provider
    (publish-post/index.ts:126-129) and no reaper exists (P6-003), a hung Zernio call
    is a direct mechanism for producing exactly the frozen-post state observed live in
    20 rows.
    llm.ts is mostly covered (3 of 5). fal.service.ts is largely uncovered (1 of 7).
  expected_behavior: >
    Every outbound network call must carry a timeout. For the publishing path
    specifically, the timeout must be shorter than the reaper threshold so a hung
    provider fails cleanly rather than stranding the record.
  persona_impact:
    power_migrant: "Experiences posts that neither publish nor fail — the worst outcome for a scheduling tool, and one they cannot diagnose or retry."
    casual_operator: "Post silently never appears; no error is ever shown."
  severity: MAJOR
  blast_radius: ["P6", "P4"]
  effort: S
  effort_reasoning: "Add AbortSignal.timeout() to each call site. The pattern already exists in llm.ts and can be copied. Roughly 25 call sites."
  confidence: HIGH
  unverified_notes: "Whether Supabase edge functions impose a platform-level wall-clock limit that partially mitigates this was not verified; even if so, it would produce an abrupt kill rather than a handled timeout, still leaving the post stranded."
  trace_id: "T-P10q-05"
  source_agent: "A14/orchestrator"

