- finding_id: P10q-007
  pillar: P10
  capability: "cron monitoring reports dispatch, not outcome"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "cron jobs use net.http_post (20260710120000_vault_based_cron_secrets.sql:118-127 and siblings)"
    - "pg_net http_post is ASYNC — it returns a request_id immediately; the cron command succeeds if the SQL runs"
    - "get_cron_job_status().last_status reads cron.job_run_details, which records SQL success, not the HTTP response"
    - "actual HTTP statuses live in net._http_response, which nothing reads"
    - "observed 2026-08-21: credit-monthly-reset last_status=succeeded for 2026-08-01 — proves a request was SENT, nothing about the response"
  observed_behavior: >
    Every cron job that calls an edge function does so through net.http_post,
    which is asynchronous. The scheduled command returns a request_id the moment
    the request is queued, so cron records success regardless of what the target
    returns. A function that has been answering 401 or 500 for months still
    shows last_status = succeeded.
    This is the same class of defect as the get_cron_job_status allowlist fixed
    in L0.3: monitoring that reports health it cannot observe. L0.3 made the
    jobs visible; their outcomes are still not.
    Discovered while verifying L1.7 — the only way to see real status codes was
    to query net._http_response by hand.
  expected_behavior: >
    Job health must reflect the HTTP outcome. get_cron_job_status() should join
    net._http_response and surface the last status code, and alert on non-2xx.
  persona_impact:
    power_migrant: "Invisible directly, but it is why a broken scheduled job reaches them before it reaches the operator."
    casual_operator: "Same."
  severity: MAJOR
  blast_radius: ["P2", "P6", "P8", "P10"]
  effort: S
  effort_reasoning: "Extend get_cron_job_status() with a lateral join onto net._http_response keyed by request_id, and alert on non-2xx. The response data is already being captured — nothing reads it."
  confidence: HIGH
  unverified_notes: >
    Whether request_id is retained anywhere that allows joining a cron run to
    its response was not established. If not, the jobs may need to record it.
  trace_id: "T-P10q-07"
  source_agent: "orchestrator"
