- finding_id: P10q-002
  pillar: P10
  capability: "Stripe payment webhook -> credit grant (money path)"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "src/app/api/webhooks/stripe/route.ts:45-49 (handleWebhookEvent(event).catch(...) is fired without await; HTTP 200 {received:true} is returned to Stripe on line 49 regardless of whether the async handler has finished, or even started)"
    - "src/app/api/webhooks/stripe/route.ts:63-129 (every failure branch inside handleWebhookEvent — missing metadata, invalid credits, dup-check query error, credit fetch error, balance update error, transaction insert error — does console.error(...) and `return;`, with no retry, no dead-letter write, no alert)"
    - "src/app/api/webhooks/stripe/route.ts:90-116 (balance is read on line 90-94 and written back with a plain UPDATE on line 104-111 — read-modify-write on user_credits.balance with no row lock / atomic increment / RPC, so a concurrent request — e.g. a simultaneous generation debit — can race and lose an update)"
  observed_behavior: "Because handleWebhookEvent is invoked without await and the 200 response is sent unconditionally right after, Stripe's own webhook retry mechanism (which only fires on non-2xx or timeout) can never be triggered by a failure in this code — a paid customer whose credit grant silently fails inside handleWebhookEvent gets no retry from Stripe, no error reported by the app, and no credits. The only trace is a console.error line in Vercel/Next server logs, which per finding P10q-001 has no aggregation or alerting. Separately, the balance update is a non-atomic read-then-write, creating a lost-update race against concurrent credit debits."
  expected_behavior: "A payment webhook must be awaited before responding (or the 200 only sent after durable persistence, e.g. writing to a queue/outbox table), all failure branches must be reported to an on-call channel (this is literally lost revenue / support tickets), and balance mutations must use an atomic increment (SQL `balance = balance + X` or a dedicated RPC) rather than read-then-write."
  persona_impact:
    power_migrant: "Expects purchased credits to appear instantly and reliably, as with any competitor billing flow; a silent failure here means paying and not getting product, the single fastest way to lose trust and trigger a chargeback."
    casual_operator: "Doesn't know to check a balance discrepancy — just assumes the product is broken or that they were scammed, contacts support (if they even bother) rather than retrying."
  severity: BLOCKER
  blast_radius: ["P10s"]
  effort: S
  effort_reasoning: "Awaiting the handler and wrapping the balance update in a single atomic RPC (already a common pattern elsewhere in the codebase, e.g. increment-style RPCs) is a small, contained change; the harder part is wiring in the alerting from P10q-001 first."
  confidence: HIGH
  unverified_notes: ""
  trace_id: "T-P10q-02"
  source_agent: "A14"

- finding_id: P10q-003
  pillar: P10
  capability: "AI provider fallback (Groq -> Anthropic) — root cause of the cross-agent-verified silent cost inversion"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "supabase/functions/_shared/llm.ts:172-191 (callLlm loops providers in preference order; the per-provider try/catch at 173-188 has NO console.error/console.warn/log call of any kind on failure — line 186-188 is `catch (error) { lastError = error instanceof Error ? error : new Error(String(error)); }` and the loop silently continues to the next provider)"
    - "supabase/functions/generate-content-plan/index.ts:194-217,219-246 (both generatePlan() and revisePlan() call callLlm with preferredProvider: 'groq'; the actual provider used is returned as `provider: llmResult.provider` but only inside the HTTP response body returned to the caller on line 282 — grep of the file confirms zero DB insert, zero console.log referencing provider/groq/fallback)"
    - "supabase/functions/generate-content-plan/index.ts:282 (return jsonResponse(await generatePlan(body.brief)) — the only place `provider` is used; nothing reads or compares it against the requested preferredProvider)"
  observed_behavior: "When Groq fails (as it has 100% of the time since ~2026-08-18 per cross-agent verification), callLlm's catch block does not log anything — not even which provider failed or why — before falling through to Anthropic. Anthropic succeeds, the function returns 200 OK with a valid content plan, and the only artifact that ever reveals the substitution is a `provider: \"anthropic\"` field buried in a JSON response body that no code path stores, diffs against the request, or alerts on. This is the exact mechanism by which a multi-day, 100%-failure-rate, cost-inverting Groq outage produced zero errors, zero logs, and zero alerts."
  expected_behavior: "A provider fallback must, at minimum, console.error/log the failed provider and reason before falling back (so it's visible in Supabase function logs), and should increment a metric or write a row so a dashboard/alert can catch a fallback rate that spikes to 100% — the entire point of having a fallback is defeated if using it is invisible."
  persona_impact:
    power_migrant: "N/A directly for this user — this is an ops/founder-facing blind spot, not something an end user perceives directly, but the founder is the 'user' who is harmed: they lose the ability to control AI spend and quality tier without knowing it."
    casual_operator: "Indirectly harmed if Anthropic-quality output differs from Groq-quality output in ways the founder assumed were consistent — the operator gets whatever the silent fallback produced with no way to know a substitution happened."
  severity: BLOCKER
  blast_radius: ["P1", "P2", "P4", "P10s"]
  effort: XS
  effort_reasoning: "Adding one console.error/warn line inside the existing catch block, plus optionally writing one row to a metrics/log table, is a trivial change — this is the cheapest, highest-leverage fix identified anywhere in the P10q pillar."
  confidence: HIGH
  unverified_notes: ""
  trace_id: "T-P10q-03"
  source_agent: "A14"

