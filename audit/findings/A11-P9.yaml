- finding_id: P9-007
  pillar: P9
  capability: "calendar Drafts-rail thumbnail rendering for video generations"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "src/calendar/components/UnscheduledRail.jsx:48 (thumbnailUrl = draft.generations?.storage_path || null — used as-is, no host/scheme guard)"
    - "src/calendar/components/UnscheduledRail.jsx:79 (<video className=\"draft-card__thumb\" src={thumbnailUrl} .../> — renders the raw storage_path directly as the <video> src)"
    - "src/components/Generate/BatchGenerationGrid.jsx:11 (a DIFFERENT component already has: url.includes('video.pollinations.ai') ? FALLBACK_VIDEO_URL : url — proving the team knows storage_path can legitimately be a live video.pollinations.ai URL and that it needs a fallback)"
    - "src/components/Generate/PostProductionPanel.jsx:23 (same fallback guard, independently duplicated)"
    - "Live Playwright run against /app/calendar as the QA user (this session) produced console/network failures: 'GET https://video.pollinations.ai/prompt/<full URL-encoded prompt text>?width=720&height=1280&seed=602149 net::ERR_NAME_NOT_RESOLVED' (and 3 more, one per queued/drafted video generation) plus matching 'CONSOLE ERR: Failed to load resource: net::ERR_NAME_NOT_RESOLVED'"
  observed_behavior: >
    For at least some of this user's generations, the `generations.storage_path`
    column is not a stored asset at all — it is a direct, un-cached
    video.pollinations.ai/prompt/<full prompt text> URL, i.e. a live third-party
    generation endpoint being used as if it were a static thumbnail. Two Studio
    components (BatchGenerationGrid, PostProductionPanel) already detect this and
    substitute a fallback video, proving this is a known, previously-hit problem —
    but UnscheduledRail.jsx (the Calendar page's Drafts rail, in this auditor's P9
    scope) has no such guard, so it renders the raw URL straight into a <video src>.
    In this environment the domain fails DNS resolution entirely
    (ERR_NAME_NOT_RESOLVED), so the thumbnail is simply broken/blank for every video
    draft with this storage_path shape. Even where the domain does resolve, using a
    live generation endpoint as a thumbnail means every calendar render re-issues an
    AI image/video generation call and re-transmits the full original prompt text to
    a third party — not a caching or performance concern this auditor is sizing, but
    directly relevant to "does the UI show real, stable content."
  expected_behavior: >
    Thumbnails should point at a stored, stable asset URL. Where a fallback is
    necessary for legacy/malformed storage_path values, it needs to be applied
    consistently everywhere that value is rendered as media — not patched in two
    Studio components while the Calendar surface (which pulls from the same
    `generations` table) is left exposed.
  persona_impact:
    power_migrant: "A content calendar with visibly broken/blank thumbnails on drafts reads as unfinished software and undermines confidence in the whole scheduling surface, especially since Studio (a few clicks away) clearly handles the same data correctly."
    casual_operator: "Sees blank boxes where preview images should be and has no idea why — assumes the upload/generation failed even when the underlying content is fine, likely re-generating or abandoning the draft unnecessarily."
  severity: MAJOR
  blast_radius: ["P4", "P5"]
  effort: S
  effort_reasoning: "The exact fallback pattern already exists twice in the codebase (BatchGenerationGrid.jsx:11, PostProductionPanel.jsx:23); extracting it to a shared helper and applying it in UnscheduledRail.jsx (and auditing any other raw storage_path consumers) is small, mechanical work."
  confidence: HIGH
  unverified_notes: ""
  trace_id: "T-P9-07"
  source_agent: "A11"

