- finding_id: P4-017
  pillar: P4
  capability: "Clip-engine rate limiting fails open, races, and is trivially bypassable"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "src/lib/video-engine/rate-limiter.ts:6-7"
    - "src/lib/video-engine/rate-limiter.ts:20-23"
    - "src/lib/video-engine/rate-limiter.ts:41-44"
    - "src/lib/video-engine/rate-limiter.ts:33-39"
    - "app/api/video/submit/route.ts:136-150"
    - "app/api/video/jobs/[id]/route.ts:121-125"
  observed_behavior: >
    checkSubmissionRateLimit enforces MAX_CONCURRENT_JOBS = 2 and HOURLY_SUBMISSION_LIMIT = 10
    (rate-limiter.ts:6-7) against an expensive, credit-consuming, provider-billed pipeline.
    Three defects:
    (a) FAILS OPEN. Both count queries return `{ allowed: true }` on ANY error
    (:20-23, :41-44). A Supabase blip, a statement timeout, or any induced error disables
    rate limiting completely rather than denying. For a limiter whose purpose is cost
    control, open is the wrong direction to fail.
    (b) TOCTOU RACE. The limiter counts (rate-limiter.ts:14-18) and the submit route then
    inserts (submit/route.ts:141-150) with no lock, no unique constraint, and no atomic
    check-and-insert. N concurrent requests all observe the same pre-insert count and all
    pass, so the concurrency cap is advisory only under exactly the condition it exists to
    handle. The generative pipeline avoids this class of problem with an atomic
    reserveCredits; the clip pipeline does not.
    (c) THE HOURLY LIMIT IS SELF-ERASING. It counts `video_jobs` rows created in the last
    hour (:33-39). DELETE /api/video/jobs/[id] hard-deletes the row
    (jobs/[id]/route.ts:121-125). A user who deletes their jobs resets their own hourly quota
    — the limiter counts exactly the rows the user is allowed to destroy.
    The credit floor is no backstop either: submit checks `balance < MIN_CREDITS_TO_SUBMIT`
    (submit/route.ts:128) but does not RESERVE anything (see P4-018), so the same race lets
    two jobs past a 5-credit balance.
  expected_behavior: >
    Deny on error, enforce concurrency with an atomic constraint or advisory lock, and count
    against an append-only ledger the user cannot delete.
  persona_impact:
    power_migrant: "Scripting the API — normal behaviour for this persona — trivially exceeds both caps and racks up provider cost, with no server-side backstop."
    casual_operator: "Unaffected directly, but they absorb the consequences when abuse forces the caps down for everyone or exhausts the free tier's budget."
  severity: MAJOR
  blast_radius: ["P9", "P10s"]
  effort: S
  effort_reasoning: "Fail closed, move the counter to credit_transactions (append-only), and add a partial unique index or advisory lock for the concurrency cap."
  confidence: HIGH
  unverified_notes: >
    Whether Supabase RLS or an edge-level WAF imposes a separate global limit was not
    checked; this finding is about the application-level limiter only.
  trace_id: "T-P4-03"
  source_agent: "A5"

- finding_id: P4-018
  pillar: P4
  capability: "Clip-engine credits are non-atomic read-modify-write, and the docstring contradicts the code"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "video-worker/database.py:329-380"
    - "video-worker/database.py:341-369"
    - "video-worker/database.py:178-201"
    - "video-worker/stages/download.py:271"
    - "app/api/video/submit/route.ts:113-134"
    - "supabase/functions/_shared/generationIdempotency.ts (reserveCredits — the correct pattern, used by the generative path)"
  observed_behavior: >
    The two halves of P4 handle money with completely different rigour.
    GENERATIVE: atomic reserveCredits at submit, refund via the `refund_credits` RPC
    (generateVideo/index.ts:111-127).
    CLIP: deduct_credits (database.py:329-380) does a plain SELECT balance (:341-345), a
    comparison in Python (:353), an arithmetic step in Python (:362-363), and a separate
    UPDATE (:365-369). There is no RPC, no transaction, no optimistic-concurrency guard, and
    no `WHERE balance = <observed>` predicate. Two concurrent deductions read the same
    balance and the second UPDATE overwrites the first — one deduction is lost and the user
    gets free processing. Combined with P4-017's racing concurrency cap, this is reachable
    rather than theoretical.
    THE DOCSTRING CONTRADICTS THE CODE. refund_credits at database.py:178-201 documents
    itself as "Updates balance and lifetime_consumed atomically via RPC" (:181) — and the
    implementation immediately beneath it is a SELECT (:185-186) followed by an UPDATE
    (:199-201) with no RPC anywhere. This is a doc/code disagreement inside a single
    function, and it is about money.
    That same refund path also corrupts a lifetime metric: `new_lifetime_consumed =
    max(0, current.data["lifetime_consumed"] - amount)` (:196) DECREMENTS lifetime_consumed
    on a refund, so a value defined as cumulative goes backwards and can be floored at 0.
    TIMING GAP: submit only CHECKS the balance (submit/route.ts:128-134); the actual
    deduction happens much later, inside the download stage (download.py:271), once the true
    duration is known. Everything between — queueing, the full source download, its bandwidth
    and disk — is performed before the user has paid, and is unrecoverable if the deduction
    then fails for insufficient credits.
  expected_behavior: >
    All credit movement through one atomic RPC with a balance guard, reservation at submit,
    and monotonic lifetime counters. The generative path already demonstrates the pattern;
    the clip path should not have its own.
  persona_impact:
    power_migrant: "Two parallel submissions can be charged once. They will find this before the business does, and the ledger they see in the credit dashboard will not reconcile."
    casual_operator: "Sees a lifetime-consumed figure that decreases after a refund, and occasionally a job that dies after several minutes of apparent progress because the charge failed at the download stage."
  severity: MAJOR
  blast_radius: ["P9"]
  effort: M
  effort_reasoning: "Move both deduct and refund onto the existing atomic credit RPCs and reserve at submit. Straightforward, but it changes the worker's failure semantics and needs a reconciliation of existing balances."
  confidence: HIGH
  unverified_notes: >
    download.py is inside video-worker/stages/ (A6's scope); it is cited here only for the
    single call site of deduct_credits, not for its clipping logic. The atomicity finding
    rests on database.py, which is shared infrastructure.
  trace_id: "T-P4-03"
  source_agent: "A5"

