- finding_id: P4-011
  pillar: P4
  capability: "Storage & delivery — two incompatible models; generative output is world-readable forever"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "supabase/functions/_shared/videoJobFinalize.ts:4"
    - "supabase/functions/_shared/videoJobFinalize.ts:39-45"
    - "supabase/functions/_shared/videoJobFinalize.ts:61-66"
    - "app/api/video/clips/[id]/refresh-url/route.ts:13"
    - "app/api/video/clips/[id]/refresh-url/route.ts:52-68"
  observed_behavior: >
    The two video systems store and deliver output on opposite security models.
    CLIP ENGINE — bucket `video-clips`, PRIVATE. Delivery is a signed URL with
    SIGNED_URL_EXPIRY = 172800 seconds (refresh-url/route.ts:13), i.e. 48 hours. THIS IS WHY
    refresh-url EXISTS: the URL persisted in `video_clips.public_url` is a time-limited
    signature, so after 48 hours every stored link 404s and the row needs re-signing
    (route.ts:52-68 re-signs and overwrites public_url). The column name `public_url` is
    actively misleading — it holds an expiring credential, and any copy of it a user pasted
    elsewhere (a Slack message, a scheduled post, a shared doc) silently dies after two days.
    GENERATIVE ENGINE — bucket `generated_assets`, PUBLIC. videoJobFinalize.ts:45 calls
    `getPublicUrl(fileName)` and writes that unsigned, non-expiring URL into BOTH
    generations.output_url and generations.storage_path (:64). Anyone who ever obtains the
    URL retains permanent unauthenticated access; there is no revocation. The object key is
    `${job.user_id}/${Date.now()}_${fal_model_id}.mp4` (:39), so the owner's raw user UUID is
    embedded in a world-readable URL — a cross-user correlation handle leaked with every
    shared video.
    Schema semantics are also broken by :64 — `storage_path` is set to a full public URL
    rather than a storage key, which is why legacy rows contain pollinations.ai and
    googleapis.com URLs in a column named for a path (see P4-002).
    EGRESS: the public bucket is served directly from Supabase storage with no CDN in front,
    no signed-URL throttle, and no hotlink protection. Every play, every re-play, and every
    third-party embed bills Supabase egress against the account with no per-user cap and no
    attribution back to the user who generated it. Uploads are also duplicated per
    reconciliation attempt (see P4-009 Hole 2), so a single stuck job can write the same
    video up to 20 times.
  expected_behavior: >
    One storage model for both pipelines. User-generated media should be private with
    short-lived signed URLs minted at render time (never persisted as if permanent), object
    keys should not embed user identifiers, and egress should sit behind a CDN with a cap.
  persona_impact:
    power_migrant: "Discovers that clip links they pasted into a scheduling tool or a client email are dead after 48 hours, while generative videos are permanently public to anyone with the link. Neither behaviour is documented, and the inconsistency between them is indefensible on a client account."
    casual_operator: "Shares a video link, and two days later a colleague reports it is broken — with no explanation anywhere in the product and no obvious way to get a working link again."
  severity: MAJOR
  blast_radius: ["P6", "P10s"]
  effort: M
  effort_reasoning: "Unify on private buckets with mint-on-read signed URLs, stop persisting URLs as durable values, and re-key objects away from raw user ids. Touches both pipelines plus every consumer that reads a stored URL."
  confidence: HIGH
  unverified_notes: >
    That `generated_assets` is actually a public bucket is inferred from the code calling
    getPublicUrl (which only yields working URLs for public buckets) plus the live
    generations rows holding /storage/v1/object/public/generated_assets/ URLs. Bucket ACLs
    were not read directly — that requires the storage admin API, not PostgREST.
  trace_id: "T-P4-11"
  source_agent: "A5"

