- finding_id: P4-020
  pillar: P4
  capability: "Worker deployment is unverified and the app's only pointer to it is localhost"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - ".env.local:35 (WORKER_WEBHOOK_URL=http://localhost:8001)"
    - "src/lib/video-engine/worker-client.ts:5"
    - "src/lib/video-engine/worker-client.ts:7"
    - "app/api/video/submit/route.ts:157-160"
    - "video-worker/railway.toml:1-10"
    - "video-worker/Dockerfile:1-25"
    - "video-worker/poller.py:15-45"
  observed_behavior: >
    worker-client.ts:5 resolves the worker as `process.env.WORKER_WEBHOOK_URL ||
    'http://localhost:8001'` — a localhost default baked into the client, matching
    .env.local:35. Railway deployment config exists (railway.toml:1-10, restartPolicy
    ON_FAILURE with max 3 retries; Dockerfile installs ffmpeg) but nothing in the repo
    records the deployed URL, so production configuration is UNVERIFIED, and if the env var
    is ever missing in a deployed environment the app silently posts job notifications into
    its own loopback.
    THE MITIGATION IS REAL, THOUGH. notifyJobSubmitted is genuinely best-effort — its failure
    is a console.warn and a `worker_notified: false` field in the 201 response
    (submit/route.ts:157-168); the job row is created regardless. And poller.py:15-45 runs an
    independent claim loop every WORKER_POLL_INTERVAL_SECONDS (5) calling claim_next_job(),
    so a job whose notification never landed is still picked up within seconds. The webhook
    is an optimisation, not the transport. That is the right design.
    THE RESIDUAL PROBLEM IS OBSERVABILITY. `worker_notified: false` is returned to the client
    and, on the evidence of the submit UI, never surfaced. The app has no way to distinguish
    "worker deployed and healthy" from "worker down and every job silently accumulating in
    queued" — the only health check is the unrouted localhost widget in P4-019. Live data is
    consistent with either reading: zero video_jobs rows for the last 7 weeks (P4-003).
    A 3-second timeout (worker-client.ts:7) on an inter-service call over the public internet
    is also tight enough to fail routinely on a cold Railway container, making
    worker_notified: false the expected rather than exceptional case.
  expected_behavior: >
    A deployed worker's URL should be configuration with no localhost fallback, its health
    should be visible to operators and reflected in the submit UI, and the queue depth of
    unclaimed jobs should be alertable.
  persona_impact:
    power_migrant: "Submits and sees a job sit at 'In Queue' indefinitely with the UI's own copy promising 'Usually seconds', with nothing anywhere telling them the worker is not running."
    casual_operator: "Waits on a queued job that will never move, has no error to act on, and concludes the product is broken — which, in that state, it is."
  severity: MAJOR
  blast_radius: ["P5"]
  effort: S
  effort_reasoning: "Remove the localhost fallback, fail loudly on missing config, raise the timeout, and surface worker health plus queue depth. Small, but it needs the deployed URL confirmed first."
  confidence: MEDIUM
  unverified_notes: >
    Whether the Railway worker is currently running, and what WORKER_WEBHOOK_URL is set to in
    the production Next.js environment, cannot be determined from the repo. Resolving this
    needs the Railway dashboard and the production env. This is the single largest open
    question in P4's clip half.
  trace_id: "T-P4-03"
  source_agent: "A5"
