    The entire prompt-enhancement stage is wrapped in `try { … } catch (_) { finalPrompt =
    rawPrompt; }` (generateVideo/index.ts:132,146-148). The catch binds nothing, logs
    nothing, and records nothing. Every failure mode collapses into the same silent
    degradation:
    * Anthropic 4xx/5xx -> llm.ts:377 throws -> swallowed.
    * The 15-second AbortSignal timeout (llm.ts:372) -> swallowed.
    * ANTHROPIC_API_KEY unset -> llm.ts:345-355 silently reroutes to Groq — the provider
      established elsewhere in this audit as having failed 100% for 2+ days — and that
      failure is then also swallowed here.
    The only trace that enhancement happened is generateVideo/index.ts:170, which writes
    `enhanced_prompt: finalPrompt !== rawPrompt ? finalPrompt : null`. So a silently
    degraded generation is indistinguishable in the database from a user who legitimately
    passed `enhance_prompt: false` — both store NULL. There is no error counter, no log
    line, no flag, and nothing in the UI.
    The consequence is not cosmetic. The system prompt's whole job is to inject
    cinematography language — "shot type, camera movement, lighting, pacing"
    (index.ts:140) — which is the difference between a usable and an unusable generation on
    these models. When it silently no-ops, the user pays 5 or 15 credits for a materially
    worse video and is told nothing. Because the fal path has never succeeded (P4-002),
    nobody has ever been able to notice the quality difference.
