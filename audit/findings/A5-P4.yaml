  observed_behavior: >
    Traced every read of all three flags across the entire repo.
    (1) VIDEO_ENGINE_USE_MOCK_ANTHROPIC — ZERO code reads. It appears only in
    .env.example:72, .env.local:36, and docs. No `process.env.VIDEO_ENGINE_USE_MOCK_ANTHROPIC`
    exists anywhere in src/, app/, supabase/, or video-worker/.
    (2) VIDEO_ENGINE_USE_MOCK_REPLICATE — ZERO code reads. Same: .env.example:73,
    .env.local:37, docs only.
    (3) VIDEO_ENGINE_USE_MOCK_PAYMENTS — read exactly once, at
    app/api/credits/purchase/route.ts:20 (`process.env.VIDEO_ENGINE_USE_MOCK_PAYMENTS === 'true'`),
    duplicated at src/app/api/credits/purchase/route.ts:20. DEFAULT WHEN UNSET — the strict
    `=== 'true'` comparison yields false, so an unset flag means REAL Stripe. .env.local:38
    sets it to `true`, so credit purchase is currently MOCKED locally.
    The flags that ACTUALLY gate mocking have DIFFERENT NAMES — WORKER_USE_MOCK_ANTHROPIC /
    WORKER_USE_MOCK_REPLICATE (video-worker/config.py:21-22). Both are `Field(default=True)`.
    ANSWER TO "what is the default when a flag is unset":
    VIDEO_ENGINE_USE_MOCK_ANTHROPIC / _REPLICATE — irrelevant either way, nothing reads them;
    VIDEO_ENGINE_USE_MOCK_PAYMENTS unset -> REAL payments (fails open to real money);
