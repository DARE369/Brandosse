- finding_id: P4-009
  pillar: P4
  capability: "Generative video queue — completion, idempotency and reaper mechanics (the parts that are right, and the two holes)"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "supabase/functions/generateVideo/index.ts:78-94"
    - "supabase/functions/generateVideo/index.ts:186-208"
    - "supabase/functions/_shared/videoJobFinalize.ts:30-68"
    - "supabase/functions/_shared/videoJobFinalize.ts:70-99"
    - "supabase/functions/job-webhook/index.ts:54-77"
    - "supabase/functions/process-jobs/index.ts:27-82"
    - "supabase/functions/cancel-video-job/index.ts:45-78"
    - "supabase/migrations/20260712120000_week3_process_jobs_cron.sql:29-39"
    - "LIVE DB: background_jobs job 68d203bb finished 20m51s after start with 'Gave up after 20 reconciliation attempts'"
  observed_behavior: >
    Full trace, attacked hop by hop.
    SUBMIT: generateVideo/index.ts — auth (:67-69), rate limit (:70), prompt validation
    (:73-74), request_id idempotency replay (:78-94), credit reservation BEFORE provider call
    (:111-114), generations row born 'processing' (:162-180), background_jobs row born
    'queued' (:189-203), fal.ai async submit with a capability-URL webhook (:210-223), then
    an update to 'running' persisting fal's own status/response/cancel URLs (:230-253).
    COMPLETION: two independent observers. job-webhook (fal pushes the payload) and
    process-jobs (pg_cron sweep). Both funnel through one module, videoJobFinalize.ts.
    WHAT IS GENUINELY RIGHT — this is the strongest-engineered queue in the codebase:
    * Duplicate webhook: safe. finalizeCompleted/finalizeFailed do the terminal write as a
      single conditional UPDATE guarded by `.eq("status","running")` (videoJobFinalize.ts:54-57,
      74-76) and return whether THIS caller won. Only the winner touches generations/credits.
    * Concurrent submit: safe. request_id replay (index.ts:79-94) returns the existing job.
    * Credit correctness: deduct-at-submit with refunds on every terminal failure path
      (index.ts:116-127, videoJobFinalize.ts:88-97, cancel-video-job:72-78).
    * Cancel: honest. Marks cancelled under a status guard so a late webhook cannot resurrect
      it (cancel-video-job:55-65), and best-effort cancels fal-side.
    * Dropped webhook: covered by process-jobs, with a bounded attempt counter
      (MAX_ATTEMPTS=20, process-jobs:38,64-68) that eventually fails-and-refunds rather than
      polling forever. The pg_cron registration is real (migration 20260712120000:29-39,
      1/min) and — critically — it is PROVEN RUNNING IN PRODUCTION by live data: job
      68d203bb started 21:03:09 and finished 21:24:00 with exactly the "Gave up after 20
      reconciliation attempts" message from process-jobs:65. 20m51s ≈ 20 sweeps at 1/min.
      This is not a get_cron_job_status() claim; it is behavioural proof.
    HOLE 1 — 'queued' is unreaped. process-jobs selects ONLY `status='running'`
    (process-jobs:53) AND `started_at < staleBefore` (:54); started_at is written only on the
    transition to running (index.ts:234), so it is NULL while queued and the filter excludes
    the row twice over. If the edge function dies between the background_jobs insert (:189)
    and the fal submit (:220) — Deno worker timeout, cold-start kill, deploy mid-request —
    the row is stranded at 'queued' forever, its generations row stranded at 'processing',
    and the reserved credits are NEVER refunded because no code path other than the
    in-function catch (:257-265) can refund them. This is the identical stuck-state class P6
    found in posts: a transient state with no reaper.
    HOLE 2 — finalizeCompleted does its expensive work BEFORE claiming. It fetches the video
    from fal (videoJobFinalize.ts:35-37) and uploads it to storage (:40-43) and only THEN
    performs the guarded UPDATE (:47-57). Any throw in those first steps — fal CDN 5xx, an
    expired fal result URL, a storage quota error — propagates to job-webhook's catch
    (job-webhook:78-81), which deliberately returns HTTP 200 to fal.ai (:35-38) so fal will
    NOT redeliver. The job stays 'running'. process-jobs is the only recovery, and it will
    re-attempt the same fetch+upload; if the cause is persistent it burns all 20 attempts and
    then fails a job whose video fal actually rendered — precisely the failure recorded live
    on 2026-08-19. It also means the video is downloaded and uploaded to storage up to 20
    times, and a race loser (videoJobFinalize.ts:59) has already paid for a full download and
    upload before discovering it lost.
  expected_behavior: >
    Every non-terminal state needs a reaper, not just the one the happy path passes through.
    The claim should be taken before expensive I/O so a transient provider or storage error
    cannot strand a job or duplicate an upload.
  persona_impact:
    power_migrant: "A job stranded at 'queued' shows a spinner that never resolves and silently keeps their credits. They have no cancel affordance that works on it (cancel-video-job does handle 'queued', but the UI only surfaces cancel from the running state) and no way to tell it apart from a slow render."
