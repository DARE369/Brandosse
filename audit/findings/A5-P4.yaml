- finding_id: P4-006
  pillar: P4
  capability: "fal.ai model routing is inverted — standard tier posts image-to-video params to a text-to-video model id"
  status: BUILT-BUT-INADEQUATE
  maturity: L1
  evidence:
    - "supabase/functions/_shared/fal.service.ts:86-88"
    - "supabase/functions/_shared/fal.service.ts:12-13"
    - "supabase/functions/_shared/fal.service.ts:518-526"
    - "supabase/functions/generateVideo/index.ts:99-104"
    - "supabase/functions/generateVideo/index.ts:216-223"
    - "LIVE DB: the only 2 fal-ai video rows, both metadata.quality='standard' + is_image_to_video=true, both failed"
  observed_behavior: >
    fal.service.ts:86 declares `videoHailuo23: "fal-ai/minimax/video-01"` with the inline
    comment "Hailuo 2.3 standard — image-to-video", repeated in the file header at :12. The
    model ID and the comment describe different things: `minimax/video-01` is MiniMax's
    first-generation endpoint, not Hailuo 2.3, and on fal.ai the image-to-video variant is a
    SEPARATE endpoint id, not the same one.
    generateVideo/index.ts:99-104 builds its whole tier logic on the comment rather than the
    id — "Hailuo 2.3 (the 'standard' tier engine) is image-to-video only", therefore
    `tierUpgraded = requestedQuality === 'standard' && !isI2V`, so a text-only standard
    request is force-promoted to premium and billed 15 credits instead of 5 (index.ts:102-104).
    Both branches are therefore wrong, in opposite directions:
    standard + image -> submitVideoHailuo (fal.service.ts:518-526) POSTs
    {prompt, image_url, duration, aspect_ratio} to `fal-ai/minimax/video-01`, an endpoint that
    does not accept image_url/duration/aspect_ratio;
    standard + no image -> silently billed 3x as premium.
    The live data matches the first branch exactly: the only two fal.ai video rows ever
    created both carry metadata quality='standard', is_image_to_video=true, and both failed —
    one "fal.ai reported ERROR via webhook", one "Gave up after 20 reconciliation attempts
    with no terminal fal.ai status". This is the most probable single cause of the 0/2
    lifetime success rate in P4-002.
  expected_behavior: >
    The model id, its comment, its declared capability and the tier routing built on it must
    agree; and at least one real submit must be observed to succeed before the surface ships.
  persona_impact:
    power_migrant: "Uploads a reference image expecting image-to-video — the flagship Kling/Runway workflow — and gets a provider error. Or submits text-only and is charged triple, with a tooltip explaining the upcharge as though it were intentional."
    casual_operator: "Both paths cost credits. One errors outright, the other quietly costs 3x what the pricing implied, and they have no vocabulary to tell the two apart."
  severity: BLOCKER
  blast_radius: ["P5", "P9"]
  effort: S
  effort_reasoning: "Correct the model ids against fal.ai's current catalog, split out the i2v endpoint, drop or invert the tier-upgrade rule. Small code change — but it requires actually running one submit to confirm."
  confidence: MEDIUM
  unverified_notes: >
    The internal contradiction (id says video-01, comment says Hailuo 2.3, tier logic derives
