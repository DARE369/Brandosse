- finding_id: P4-014
  pillar: P4
  capability: "Clip jobs cannot be cancelled once started, and DELETE conflates cancel with destroy"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "app/api/video/jobs/[id]/route.ts:15-16"
    - "app/api/video/jobs/[id]/route.ts:98-106"
    - "app/api/video/jobs/[id]/route.ts:110-130"
    - "src/lib/video-engine/worker-client.ts:7"
    - "src/lib/video-engine/worker-client.ts:42-63"
    - "LIVE DB: video_jobs a62038d2 error_message='Job timed out after 90 minutes'"
  observed_behavior: >
    CANCEL IS EFFECTIVELY IMPOSSIBLE. CANCELLABLE_STATUSES = ['queued'] (route.ts:15). Every
    other active status — downloading, transcribing, analyzing, rendering (:16) — returns
    HTTP 409 "This job is currently being processed and cannot be cancelled. Wait for it to
    complete or fail." (:101-105). Live evidence shows a job running 90 minutes before the
    worker's own timeout fired. A user who pastes the wrong URL is therefore locked out for
    up to an hour and a half with their credits spent and no way to stop it. The mid-job
    cancel that the shared brief lists as a required unhappy path simply does not exist for
    this pipeline. (The GENERATIVE pipeline does have honest cancel — cancel-video-job — so
    the two halves of P4 differ on a table-stakes affordance.)
    CANCEL IS ALSO DESTRUCTIVE. When the status IS 'queued', the same DELETE handler notifies
    the worker (:99) and then unconditionally deletes the storage prefix (:110-119) and the
    video_jobs row itself (:121-125). There is no way to cancel and keep the record. One
    endpoint means both "stop this" and "erase this from my history", and the user cannot
    ask for the first without the second.
    THE CANCEL NOTIFICATION IS FIRE-AND-FORGET. notifyJobCancelled has a 3-second timeout
    (worker-client.ts:7) and returns false on any error (:59-62); route.ts:99 awaits it and
    DISCARDS the boolean. The row is deleted regardless. If the worker is unreachable — the
    default local state, WORKER_WEBHOOK_URL=http://localhost:8001 — the job row vanishes
    while the worker may still be mid-processing, leaving it writing clip rows against a
    deleted parent.
    NO STATUS GUARD ON THE RACE. Between the SELECT at :87-92 and the DELETE at :121-125 the
    worker can claim the job and move it queued -> downloading. The DELETE carries no
    `.eq('status', …)` guard, so it proceeds anyway. This is the exact race the generative
    pipeline solves correctly with its claim pattern (videoJobFinalize.ts:54-57); the clip
    pipeline does not apply it.
  expected_behavior: >
    Cancel must work at every stage, must be separate from delete, must confirm the worker
    actually stopped, and must be guarded against the claim race.
  persona_impact:
    power_migrant: "Pastes a two-hour podcast by mistake and is told to wait for it to finish. Then discovers the only escape is an endpoint that deletes the job from their history entirely. Both behaviours are below Opus Clip's baseline."
    casual_operator: "Realises immediately they used the wrong link, finds no stop button that works, watches a progress bar for up to 90 minutes, and loses the credits with no explanation."
  severity: MAJOR
  blast_radius: ["P5"]
  effort: M
  effort_reasoning: "Requires a cooperative cancel signal the worker checks between stages, splitting DELETE into cancel and delete, and adding a status guard. Touches both the API and the worker's job loop."
  confidence: HIGH
  unverified_notes: >
    Whether the worker honours /webhook/cancel-job mid-stage is UNVERIFIED — the handler
    lives in video-worker/main.py and the stage loop is A6's scope. The API-side finding
    stands regardless, since the API refuses to even send the signal outside 'queued'.
  trace_id: "T-P4-14"
  source_agent: "A5"

