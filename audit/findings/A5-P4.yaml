- finding_id: P4-007
  pillar: P4
  capability: "Cost per output — inverted tier economics and unpriced duration"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "supabase/functions/_shared/fal.service.ts:585-593"
    - "supabase/functions/generateVideo/index.ts:32-33"
    - "supabase/functions/generateVideo/index.ts:151-156"
    - "supabase/functions/generateVideo/index.ts:174-177"
    - "LIVE DB: generations.cost = 0 on all 32 video rows"
  observed_behavior: >
    Cost per output, from the code's own constants.
    STANDARD tier — model `fal-ai/minimax/video-01`; FAL_COST_USD.videoHailouPerClip = $0.500
    per clip (fal.service.ts:591), applied flat and duration-independent
    (generateVideo/index.ts:155). Charged CREDITS_STD_VIDEO = 5 credits (index.ts:32).
    => $0.500 provider cost / 5 credits = $0.100 of provider cost per credit.
    PREMIUM tier — model `fal-ai/kling-video/v2.5/pro`; FAL_COST_USD.videoKlingPerSec = $0.070
    per second (fal.service.ts:592) multiplied by duration (index.ts:154). 5s => $0.350;
    10s => $0.700. Charged CREDITS_PRO_VIDEO = 15 credits (index.ts:33).
    => 5s: $0.350 / 15 = $0.0233 per credit. 10s: $0.700 / 15 = $0.0467 per credit.
    The tiers are economically INVERTED. "Premium" costs the business ~30% LESS in real
    dollars than "standard" at the same 5s duration ($0.35 vs $0.50) while charging the user
    3x the credits. Per credit, standard is 4.3x worse margin than premium-5s and 2.1x worse
    than premium-10s. Duration is not priced on either tier: a 10s premium clip costs the
    business exactly 2x a 5s one and the user exactly the same 15 credits.
    Separately the figure is never persisted where it can be aggregated — index.ts:176 writes
    cost_usd into `metadata` while the dedicated `generations.cost` column is 0 on all 32 live
    video rows. No query can answer "what did video cost us".
  expected_behavior: >
    Credit pricing should track marginal provider cost, duration must be priced, and realised
    cost must land in a numeric column so gross margin is observable.
  persona_impact:
    power_migrant: "Learns 10s costs the same as 5s and always requests 10s, doubling provider spend at zero extra revenue. Also sees a 'standard' tier that is both lower quality and worse value than premium — an incoherent menu."
    casual_operator: "Picks 'standard' assuming it is the cheap safe default, and gets both the failing code path (P4-006) and the worst credit value in the product."
  severity: MAJOR
  blast_radius: ["P9"]
  effort: S
  effort_reasoning: "Re-derive the credit table from FAL_COST_USD, make duration a multiplier, and write cost into generations.cost. Contained to two files."
  confidence: HIGH
  unverified_notes: >
    FAL_COST_USD values are the repo's own constants (fal.service.ts:585-593), not verified
    against fal.ai's live price list. If those constants are stale the arithmetic shifts but
    the structural inversion (flat credits vs per-second cost) does not. Verifying needs
    fal.ai's current pricing page.
  trace_id: "T-P4-07"
  source_agent: "A5"

