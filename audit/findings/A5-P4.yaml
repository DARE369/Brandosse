    - "app/layout.jsx:1-35"
    - "src/app/(video-engine)/video/new/page.tsx (byte-identical to app/ copy — diff -q reports no difference)"
  observed_behavior: >
    The premise that "one is presumably dead" is wrong — BOTH are routable and both are in
    the compiled build. The built app-paths-manifest contains all six page routes:
    /(video-engine)/video/new, /jobs, /jobs/[id]  AND  /app/video/new, /jobs, /jobs/[id].
    Because `(video-engine)` is a Next.js route GROUP, its pages serve at
    /video/new, /video/jobs, /video/jobs/[id] — distinct URLs from /app/video/*.
