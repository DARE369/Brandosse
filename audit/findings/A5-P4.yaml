  severity: MAJOR
  blast_radius: ["P6", "P9"]
  effort: M
  effort_reasoning: "Extend the process-jobs sweep to cover 'queued' (using created_at, since started_at is NULL there), and move the status claim above the fetch/upload in finalizeCompleted. Both are contained, but the second changes the failure semantics and needs care."
  confidence: HIGH
  unverified_notes: >
