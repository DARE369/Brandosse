- finding_id: P5-003
  pillar: P5
  capability: "moment selection — LLM rubric scoring (the LIVE path)"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "video-worker/stages/analyze.py:28-63"
    - "video-worker/stages/analyze.py:149-187"
    - "video-worker/stages/analyze.py:242-253"
    - "video-worker/stages/analyze.py:305-345"
    - "video-worker/stages/analyze.py:192-204"
  observed_behavior: >-
    ANSWER TO THE CORE QUESTION: this is genuine LLM moment selection, NOT naive
    chunking. There is no fixed-interval slicing anywhere in the live path. Claude
    (model "claude-sonnet-4-6", a real current-generation model ID, 1M context,
    $3/$15 per MTok) receives a ~10-second-bucketed timed transcript built at
    analyze.py:132-147 and returns explicit start_secs/end_secs float boundaries
    plus four sub-scores. The rubric at analyze.py:35-60 is genuinely engineered -
    HOOK (0-100, first 3 seconds), FLOW (story completeness), VALUE (usefulness),
    TREND (short-form fit), each with explicit score-band descriptions, and a fixed
    weighting HOOK*0.35 + FLOW*0.25 + VALUE*0.25 + TREND*0.15. The weights are NOT
    trusted from the model - analyze.py:313-319 recomputes overall_score
    server-side from the clamped sub-scores, so a hallucinated aggregate cannot
    leak through. Prompt instructions 3-8 (analyze.py:160-170) demand
    sentence-boundary cuts, non-overlapping clips, a hook-style title, a
    platform-ready caption, and a why_this_works rationale. snap_to_word_boundary
    (analyze.py:192-204) then snaps both edges to real Whisper word timestamps, so
    the cut lands on a word boundary rather than a round number.
    Where it falls short of the category leaders - (a) the model sees ONLY text,
    with no audio energy, no pause/laughter detection, no visual or scene signal
    and no speaker diarization, so a silent visual gag or an emphatic delivery is
    invisible to the scorer; (b) it is a single zero-shot call with no
    self-critique, no over-generate-then-rerank, and no code-side verification
    that the returned clips actually do not overlap - prompt rule 5 is stated and
    never enforced; (c) temperature is left at the API default with no seed, so the
    same video re-run yields different clips - there is no determinism story;
    (d) no prompt caching is set on the request (analyze.py:248-253 passes no
    cache_control), so the 900-token system prompt is re-billed on every attempt
    including all three retries.
  expected_behavior: >-
    Opus Clip's virality score and Vizard's scoring both fuse transcript semantics
    with audio and visual signals and re-rank an over-generated candidate set, and
    both guarantee non-overlapping output. A user comparing side by side will
    notice missed visual moments and occasional duplicate/overlapping clips.
  persona_impact:
    power_migrant: "Recognises the four-dimension score as competitive on paper, then finds it misses the visually funny moment and returns different clips on a re-run of the same video - reads as unreliable rather than smart."
    casual_operator: "Gets plausible clips with readable titles and a why_this_works line, which is genuinely useful; the weakness stays invisible until two returned clips overlap and the cards look near-identical."
  severity: MAJOR
  blast_radius: ["P5"]
  effort: L
  effort_reasoning: >-
    Adding audio-energy and scene signals means a second analysis pass over the
    media plus a fused scoring step; enforcing non-overlap is XS by comparison.
    The overall lift is large because it changes the input representation.
  confidence: HIGH
  unverified_notes: >-
    No clip-quality benchmark exists anywhere in the repo, so how good the picks
    actually are is untested. The determinism claim rests on the absence of a
    temperature/seed parameter in the request, not on an observed re-run.
  trace_id: "T-P5-01"
  source_agent: "A6"

- finding_id: P5-004
  pillar: P5
  capability: "analysis — output-token truncation on long videos"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "video-worker/stages/analyze.py:248-253"
    - "video-worker/stages/analyze.py:256-300"
    - "video-worker/stages/analyze.py:87-94"
    - "video-worker/stages/transcribe.py:16"
  observed_behavior: >-
    The transcript is sent WHOLE - there is no chunking and no truncation anywhere
    in build_analyze_prompt. Input overflow is not the risk - claude-sonnet-4-6 has
    a 1M context and even a 3-hour transcript is roughly 40-60K tokens. The real
    failure is on the OUTPUT side. max_tokens is pinned to 4096 at analyze.py:250
    while the prompt asks for up to 15 clips (analyze.py:88-89), each carrying a
    title, a caption, a why_this_works sentence and five numbers. Fifteen such
    objects sit right at the 4096-token boundary. When the response is cut off,
    stop_reason is never inspected - analyze.py:256 reads message.content[0].text
    directly, the brace-slicing at 263-266 hands truncated JSON straight to
    json.loads, the JSONDecodeError branch at 281 retries the IDENTICAL prompt with
    the IDENTICAL max_tokens three times, and the job then dies at 284 with
    "Claude returned invalid JSON after 3 attempts" - three full input billings for
    a failure guaranteed to repeat. The request is also non-streaming, so a long
    generation additionally risks the SDK HTTP timeout.
  expected_behavior: >-
    Long videos are exactly where a clipping product earns its keep. A competitor
    processes a two-hour podcast without a hard failure. The fix is to raise
    max_tokens, stream, check stop_reason == "max_tokens", and degrade to fewer
    clips rather than erroring out.
  persona_impact:
    power_migrant: "Uploads the 90-minute podcast that is the entire reason they bought the tool; the job fails with a JSON error. This is the single most likely first-session churn event."
    casual_operator: "Sees 'Claude returned invalid JSON after 3 attempts' as their failure message - completely opaque, and their credits were already spent on download and transcription."
  severity: BLOCKER
  blast_radius: ["P5"]
  effort: S
  effort_reasoning: "Raise max_tokens to ~16000, switch to client.messages.stream plus get_final_message, add a stop_reason guard, and on truncation re-ask for fewer clips. Localised to one function."
  confidence: MEDIUM
  unverified_notes: >-
    Have not measured an actual 15-clip response against the 4096 cap. The absence
    of any stop_reason check is certain from the code; how often it is hit is an
    estimate, not a measurement. Needed - one real long-video run with usage logged.
  trace_id: "T-P5-01"
  source_agent: "A6"

- finding_id: P5-005
  pillar: P5
  capability: "clip duration limits — module constants override user settings"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "video-worker/stages/analyze.py:15-16"
    - "video-worker/stages/analyze.py:96-122"
    - "video-worker/stages/analyze.py:326-341"
    - "video-worker/stages/analyze.py:387-388"
  observed_behavior: >-
    MIN_CLIP_SECONDS = 15 and MAX_CLIP_SECONDS = 240 are module constants applied
    unconditionally at analyze.py:326-337, AFTER the prompt has already told Claude
    to honour the user's own min_duration_secs / max_duration_secs
    (analyze.py:99-115). The two disagree. A user who asks for 10-second clips has
    every returned clip silently skipped by the `continue` at line 334 with only a
    clip_too_short_skipped log line, and if that drops all of them the job dies at
    line 388 with "No valid clips could be created from Claude response". A user
    who asks for five-minute clips gets a hard truncation to 240s mid-sentence at
    line 336. Worse, line 341 - end_secs = max(start_secs + 10, min(end_secs,
    total_duration)) - can manufacture a 10-second clip immediately after the
    15-second minimum was enforced, so the floor is not actually a floor. None of
    this surfaces to the user; it is silent skipping, not a warning.
  expected_behavior: >-
    Either the user-set duration bounds are the authority, or the UI states the
    hard product limits up front. Silently discarding output that matches what the
    user explicitly asked for is the worst of both options.
  persona_impact:
    power_migrant: "Sets 10-second clips for TikTok hooks, gets zero clips and a generic failure, and cannot tell that their own setting caused it."
    casual_operator: "Never touches the setting so is usually unaffected - until a video of short exchanges yields nothing and the failure reads as the product being broken."
  severity: MAJOR
  blast_radius: ["P5"]
  effort: XS
  effort_reasoning: "Derive the effective min/max from the job fields with the constants as fallbacks, and fix the +10 clamp on line 341."
  confidence: HIGH
  unverified_notes: >-
    Have not confirmed which duration values the UI actually permits; the job-field
    reads at analyze.py:74-77 prove the columns are consumed by the prompt builder.
  trace_id: "T-P5-01"
  source_agent: "A6"

- finding_id: P5-006
  pillar: P5
  capability: "aspect-ratio and platform export presets"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "video-worker/stages/render.py:37-51"
    - "video-worker/stages/render.py:340-348"
    - "video-worker/utils/ffmpeg_utils.py:13-14"
    - "video-worker/utils/ffmpeg_utils.py:299-312"
    - "video-worker/stages/render.py:455-461"
    - "video-worker/utils/caption_generator.py:47"
  observed_behavior: >-
    RATIO_MAP (render.py:37-43) offers 9:16, 4:5, 1:1, 16:9 and 3:4, and
    _render_single_clip reads the job's aspect_ratio at render.py:341 and derives
    out_w/out_h from it. Those values then only ever reach the CROP - crop_width =
    target_w and crop_height = out_h (render.py:455-461, 535-541, 552-558). The
    final scale is hardcoded - ffmpeg_utils.py:13-14 defines OUTPUT_WIDTH=1080 and
    OUTPUT_HEIGHT=1920, and lines 303 and 310 emit a bare `scale=1080:1920` with no
    force_original_aspect_ratio and no pad. So selecting 1:1 crops a 1080x1080
    square and then stretches it to 1080x1920 - a 1.78x anamorphic distortion in
    which faces are visibly elongated. 16:9 is worse - a 1920x1080 crop stretched
    into 1080x1920. Only 9:16 survives, and only by coincidence of matching the
    hardcoded constant. The one code path that does honour out_w/out_h is
    _render_split_layout (render.py:226-256), which encodes at the raw 608x1080 -
    a different resolution from every other clip in the same job.
    There are no platform presets in any sense a competitor would recognise - no
    per-platform duration caps, no safe-zone insets for the TikTok/Reels UI
    chrome, no per-platform bitrate or file-size targets. Captions sit at a fixed
    margin_v (caption_generator.py:47) that takes no account of where a platform
    overlays its own buttons.
  expected_behavior: >-
    Selecting 1:1 or 16:9 must produce an undistorted 1:1 or 16:9 file. Category
    leaders additionally ship per-platform presets with safe zones so burned-in
    text is never covered by the platform's own UI.
  persona_impact:
    power_migrant: "Picks 1:1 for LinkedIn, gets a stretched clip, and concludes the render pipeline is amateur. This is a single-glance disqualifier."
    casual_operator: "Stays on the 9:16 default and never hits the distortion - but their captions end up partly hidden behind TikTok's right-hand button rail because no safe zone exists."
  severity: MAJOR
  blast_radius: ["P5", "P6"]
  effort: M
  effort_reasoning: "Threading out_w/out_h through render_clip_to_file and using scale+pad with aspect preservation is small; real per-platform safe-zone presets are a design plus implementation task."
  confidence: HIGH
  unverified_notes: >-
    Have not rendered a 1:1 job to observe the distortion; the conclusion follows
    directly from an unconditional scale=1080:1920 with no aspect preservation.
  trace_id: "T-P5-02"
  source_agent: "A6"

