- finding_id: P2-009
  pillar: P2
  capability: "schedule/reschedule concurrency guard"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "src/calendar/hooks/useScheduleAction.js:122-175 (writePost): fetchPostUpdatedAt (line 138) and the actual updatePostService write (line 166) are two separate sequential network round-trips, not one atomic DB operation/transaction"
    - "src/calendar/hooks/useScheduleAction.js:17-18 self-documents this: 'the staleness check is read-then-conditionally-write, not a DB-level constraint — see DECISIONS_LOG.md for why and the residual risk'"
  observed_behavior: "Between the read of updated_at and the write, another concurrent request (e.g. the same user in two tabs, or a future org-mode multi-editor case) can slip in and be silently overwritten, since Postgres/PostgREST is never told to make the check-and-write atomic (no WHERE updated_at = X on the UPDATE itself)."
  expected_behavior: "True optimistic concurrency should apply the updated_at check as a WHERE clause on the UPDATE statement itself (single round trip, atomic), not as a separate preceding SELECT."
  persona_impact:
    power_migrant: "Working across two devices/tabs (a stated habit of power users) hits a real, if narrow, race window where a concurrent edit can be lost without the 'stale' toast ever firing."
    casual_operator: "Single-tab, single-device usage makes this essentially unreachable for them."
  severity: MINOR
  blast_radius: []
  effort: S
  effort_reasoning: "Convert the check into a conditional UPDATE ... WHERE updated_at = $1 and branch on rows-affected — the guard logic already exists, just needs to move into one query."
  confidence: HIGH
  unverified_notes: "DECISIONS_LOG.md referenced in the code comment was not read (out of evidence scope per brief — docs don't count) — the race is inferred directly from the two sequential Supabase calls in the code, not from the doc."
