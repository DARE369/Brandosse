- finding_id: ARCH-004
  pillar: P10
  capability: "application architecture — client SPA behind an App Router shell"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "app/** — 1,958 lines of route shells; src/** — 93,829 lines of client application"
    - "app/[...path]/page.jsx:1-11 — route shell mounts @/pages/NotFoundPage inside a provider wrapper"
    - "tsconfig.json:21-26 — @/* aliases to src/*"
    - "audit/findings/A11-P9.yaml (dev-mode load 3-12s first visit, 3-5s repeat; production figure UNVERIFIED)"
  observed_behavior: >
    Next.js 16 App Router is used almost exclusively as a routing and provider shell.
    Substantially all logic, data fetching and rendering happen client-side in src/**.
    The consequence is that every screen is client-fetched, so server components, server
    actions and streaming SSR are effectively unused, and the initial payload carries
    the application rather than the page.
  expected_behavior: >
    Not inherently wrong — a client SPA is a legitimate architecture. But it is a
    deliberate trade being made implicitly, and it forecloses the cheapest available
    wins for time-to-first-value and cost per request, both of which the founder cares
    about. It should be an explicit decision with a measured production baseline.
  persona_impact:
    power_migrant: "Perceives the product as slower than server-rendered competitors, particularly on first load."
    casual_operator: "First-load latency is the highest-leverage churn factor for this persona, and it is currently unmeasured in production."
  severity: MAJOR
  blast_radius: ["P9", "P10"]
  effort: XL
  effort_reasoning: "Converting meaningful surfaces to server components is a structural change across 94k lines. Sizing reflects that; a targeted conversion of only the highest-traffic routes would be M and should be evaluated first."
  confidence: MEDIUM
  unverified_notes: "Production cold-load and bundle size are UNVERIFIED — dev-mode figures are not evidence. Agent A13 is measuring the real bundle; this finding must be re-rated against that data before it enters the roadmap."
  trace_id: "T-ARCH-04"
  source_agent: "A1/orchestrator"
