    - "src/api/video/** — 3 further duplicate route files"
    - "app/** — the routed tree (Next.js resolves root app/ when both app/ and src/app/ exist)"
    - "tsconfig.json:33-40 include covers src/**/*.ts — so the dead tree IS type-checked"
    - "diff app/api/webhooks/stripe/route.ts src/app/api/webhooks/stripe/route.ts — differs ONLY in import style (@/lib/... vs ../../../../lib/...), 133 lines each"
  observed_behavior: >
    A complete second copy of the App Router tree lives under src/app/ and src/api/,
    17 files in total, including the Stripe webhook handler and the credits purchase
    route. Next.js routes the root app/ directory when both exist, so none of src/app/
    is reachable. The copies are functionally identical to their live counterparts and
    differ only in import-resolution style. Because tsconfig includes src/**, the dead
    tree is still type-checked, so it looks maintained and will not be flagged by the
    compiler as unused.
  expected_behavior: >
    One routed tree. Dead duplicates of payment and webhook handlers must not exist —
    the failure mode is an engineer editing the unreachable copy and observing no
    effect, which is expensive to diagnose precisely because the code looks correct.
