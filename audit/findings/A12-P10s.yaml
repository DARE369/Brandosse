    - "supabase/functions/credit-monthly-reset/index.ts:19-26 (the correct pattern, present in a sibling function)"
  observed_behavior: >
    The function had no authorization check. Supabase edge functions accept any
    valid project JWT by default, and the anon key qualifies — it ships in the
    client bundle and is public by design. So any visitor could invoke a
    service-level batch job and receive the complete list of active user IDs.
    Two distinct harms: enumeration (those UUIDs are the lookup key used by
    other endpoints, making this useful reconnaissance rather than trivia), and
    unauthenticated resource abuse (each call iterates every active profile with
    several queries, with no rate limit).
    Found only because LOCK L0.3 un-blinded cron monitoring, which exposed the
    job, whose hand-written command revealed the anon-key auth.
    A sweep of all 52 edge functions found this was the ONLY genuinely
    unguarded one: 46 use a shared guard, and 5 more use a legitimate token
    scheme (job-webhook per-job token, pipeline-client-action and
    org-complete-invitation-signup token flows, credit-monthly-reset
    service-role check, and healthCheck which is deliberately public and returns
    no sensitive data).
  expected_behavior: >
    A scheduled batch job has no legitimate caller except cron and must be
    service-role only.
  persona_impact:
    power_migrant: "Their user id is obtainable by any visitor, which weakens every other id-keyed surface."
    casual_operator: "Same exposure, undetectable to them."
  severity: MAJOR
  blast_radius: ["P10", "P8"]
  effort: XS
  effort_reasoning: "Copy the existing service-role guard from credit-monthly-reset, plus one migration re-registering the cron job with Vault auth. Both written."
