- finding_id: P10s-008
  pillar: P10s
  capability: "Stripe webhook idempotency (credit purchase double-crediting race)"
  status: BUILT-BUT-INADEQUATE
  maturity: L3
  evidence:
    - "app/api/webhooks/stripe/route.ts:22-42 correctly verifies the Stripe signature via stripe.webhooks.constructEvent before trusting the payload, and fails closed (500) if STRIPE_WEBHOOK_SECRET is unset — this part of the flow is solid."
    - "app/api/webhooks/stripe/route.ts:72-84: idempotency is implemented as a check-then-act pattern — SELECT credit_transactions WHERE stripe_payment_id = X (line 72-75), and only if no row is found does it proceed to update user_credits.balance (line 88-107) and then INSERT the credit_transactions row (line ~109+). This is NOT atomic: two webhook deliveries for the same event (Stripe explicitly documents webhooks can be delivered more than once, and retries on any non-2xx or timeout) arriving close enough together can both pass the SELECT-finds-nothing check before either has inserted its row, both then proceed to add credits."
    - "supabase/migrations/20260710090000_baseline_core_tables.sql:519 defines `stripe_payment_id text` on credit_transactions with no UNIQUE constraint or unique index found anywhere in supabase/migrations/*.sql (grep for stripe_payment_id returns only this one column-definition line) — so there is no database-level backstop against the race even if the application-level check is beaten."
  observed_behavior: "A duplicate/retried Stripe webhook delivery arriving within the window between the duplicate-check SELECT and the credit_transactions INSERT can cause a user's credit balance to be incremented twice for a single payment."
  expected_behavior: "Payment-crediting idempotency should be enforced with a database-level UNIQUE constraint on stripe_payment_id (or the Stripe event id), so even a genuine race between concurrent webhook deliveries cannot double-credit — the application-level check-then-act pattern alone is insufficient."
  persona_impact:
    power_migrant: "Not something they'd notice directly, but a systemic double-crediting bug (even if rare) is a real, quantifiable revenue-leak the business absorbs silently."
    casual_operator: "No visible negative impact to them (they'd just get bonus credits) — this is purely a business-cost/abuse-surface issue, not a user-facing harm."
  severity: MEDIUM
  blast_radius: ["P8"]
  effort: XS
  effort_reasoning: "Add a UNIQUE constraint/index on credit_transactions(stripe_payment_id) via a new migration, and catch the resulting unique-violation error in the webhook handler as the 'already processed' signal instead of relying solely on the pre-check SELECT."
  confidence: MEDIUM
  unverified_notes: "This is a race-condition finding based on static code + schema reading, not reproduced live (would require sending duplicate concurrent webhook payloads, which risks real credit mutation and was not attempted under this read-only audit's constraints). Likelihood of actual exploitation depends on Stripe's real-world redelivery timing, which was not measured."
  trace_id: "T-P10s-07"
  source_agent: "A12"

