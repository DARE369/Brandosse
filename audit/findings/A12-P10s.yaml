    - "supabase/migrations/20260312153000_admin_foundation.sql:310-317 (get_admin_role COALESCEs to profiles.role)"
    - "supabase/migrations/20260312153000_admin_foundation.sql:350-357 (is_admin_user -> get_admin_role)"
