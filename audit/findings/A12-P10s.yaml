- finding_id: P10s-010
  pillar: P10
  capability: "profiles.credits self-writable — display integrity (CORRECTED)"
  status: BUILT-BUT-INADEQUATE
  maturity: L2
  evidence:
    - "live probe 2026-08-21: PATCH /rest/v1/profiles {\"credits\":999999} -> 204, profiles.credits changed 100 -> 999999 (reverted)"
    - "live probe 2026-08-21: PATCH /rest/v1/user_credits {\"balance\":999999} -> 204 but balance UNCHANGED at 531 — RLS correctly filtered the row"
    - "supabase/functions/generateImage/index.ts:186 (spend reads user_credits.balance)"
    - "supabase/migrations/20260622000001_deduct_credits_rpc.sql:15-21 (deduct_credits updates user_credits)"
    - "src/components/User/ProfileMenu.jsx:26 and src/admin/pages/AdminUserDetailPage.jsx:365 (profiles.credits is rendered)"
  observed_behavior: >
    CORRECTED — an earlier version of this finding rated it BLOCKER on the
    assumption that a self-writable credit balance granted free access to paid
    AI providers. That was WRONG and is retracted here.
    Two different columns exist. profiles.credits IS self-writable. But every
    metered operation checks user_credits.balance, and deduct_credits updates
    user_credits — and user_credits.balance was verified NOT self-writable
    (the PATCH returned 204, the standard PostgREST response when RLS filters
    the row out of the UPDATE, and the balance was unchanged).
    So the real impact is display integrity, not spend: a user can inflate the
    credit figure shown in their own profile menu and on the admin user-detail
    page, while their actual spending power is untouched. profiles.credits
    appears to be a vestigial duplicate of the real balance.
    Note the 204-with-no-effect response is exactly why status codes alone are
    not evidence — the write must be re-read to know whether it landed.
  expected_behavior: >
    A vestigial duplicate of a security-relevant value should not exist. Either
    profiles.credits is removed and all display reads point at
    user_credits.balance, or it is made non-self-writable by the same guard.
    Two sources of truth for a money figure is the underlying defect.
  persona_impact:
    power_migrant: "Could display a false balance to themselves; no real gain. Minor."
    casual_operator: "Unaffected."
  severity: MAJOR
  blast_radius: ["P9", "P10"]
  effort: XS
  effort_reasoning: "Covered by the same guard as P10s-009 (profile_self_update_guard already asserts credits unchanged). The better fix is deleting the duplicate column and pointing display reads at user_credits."
  confidence: HIGH
  unverified_notes: >
