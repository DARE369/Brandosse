    - "app/api/auth/zernio/connect/route.js:2 also references 'app/api/auth/oauth/route.js's request/auth pattern' as the thing this flow mirrors minus the state — but no such file exists anywhere under app/ (confirmed via find app -path '*oauth*' -type f and find app -path '*api/auth*' -type f, which list only the three zernio/* routes). The comment points at a file that is not in the current tree, so its 'mirrors X' justification cannot be verified and may be stale/aspirational."
    - "app/api/auth/zernio/callback/route.js:120-131 resolves which Brandosse user a callback belongs to PURELY from the `profileId` URL query parameter — `SELECT id FROM profiles WHERE zernio_profile_id = <profileId query param>` — with NO check of the requester's own session/cookies/Authorization header at all (unlike connect/route.js, which does call getRequestUser()). The callback route has no equivalent auth check."
    - "app/api/auth/zernio/callback/route.js:141-148 then does `upsertZernioAccount({ userId, platform, account: { _id: accountId, username } })` where `userId` came from that unauthenticated profileId lookup and `accountId`/`platform`/`username` come directly, unsigned and unvalidated, from the request's query string — the resulting row is inserted/updated in public.connected_accounts scoped to that resolved userId."
    - "profileId is not a session-bound secret: it is generated server-side (connect/route.js:104-114, a Zernio-issued Mongo-style _id) but is then embedded in cleartext in a URL that (a) appears in the user's own browser address bar/history during a legitimate connect, (b) is sent to zernio.com as a query parameter (and from there, per standard browser Referer behavior, potentially to any third-party resource zernio.com's OAuth pages load), and (c) is echoed back by Zernio's own redirect. Nothing about it is single-use, time-limited, or bound to the browser session that initiated the flow."
  observed_behavior: "The callback endpoint that creates/updates a user's connected_accounts row is reachable by anyone who can supply a valid platform+profileId(+accountId) query string, with no CSRF token, no session check, and no proof the caller is the browser that started the flow. Knowledge of a victim's zernio_profile_id value (leaked via Referer/history/logs, or simply observed once during any legitimate flow involving that user) is sufficient to directly link an attacker-controlled social account into the victim's Brandosse account via a single unauthenticated GET request — no victim browser interaction required at request time, since the endpoint doesn't rely on the victim's session at all."
