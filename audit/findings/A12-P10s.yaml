  capability: "daily-analysis edge function — unauthenticated, discloses all user IDs"
  status: BUILT-BUT-INADEQUATE
  maturity: L1
  evidence:
    - "live 2026-08-21: POST /functions/v1/daily-analysis with ONLY NEXT_PUBLIC_SUPABASE_ANON_KEY -> HTTP 200"
