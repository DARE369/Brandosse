    - "scripts/security/cross-tenant-probe.mjs (now asserts this)"
  observed_behavior: >
    An ordinary authenticated user, with only the public anon key and their own
    JWT, can set their own profiles.role to 'admin'. Because get_admin_role()
    falls back to profiles.role, this resolves to 'super_admin', which makes
    is_admin_user() and can_admin_access_user(anyone) return true — and both the
    posts and generations RLS policies consult those. The result is full
    cross-tenant read access.
    This means the cross-tenant fix applied in 20260821090000 is reopenable by
    any user in a single request. The two findings are not independent: this one
    subsumes it.
    The audit originally rated the related admin-list-posts issue (P10s-006) as
    "plausible, not write-confirmed". It is now confirmed, and the root cause is
    broader than that one edge function.
