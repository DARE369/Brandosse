# video-worker/fly.toml — LOCK L7.1
#
# Replaces railway.toml, deleted in the same change. The repo describes exactly
# one host; two deploy configs is how a service ends up running in two places
# and being debugged in a third.
#
# Deploy:  cd video-worker && flyctl deploy --config fly.toml --dockerfile Dockerfile
#
# Run it FROM video-worker/, not from the repo root. flyctl's build context is
# the working directory, and .dockerignore is only read from the context root —
# so deploying from the repo root ignores video-worker/.dockerignore entirely
# and uploads the whole repo. Measured 2026-09-04: 1.5 GB and still climbing
# after 8 minutes (node_modules, .next, and the very venv/ the ignore file
# exists to exclude). From this directory the same deploy is a 665 MB image.
# Adding a root .dockerignore would not fix it — the root context is wrong for
# a Dockerfile whose COPY . . expects to see only the worker.
#
# ── Sizing: a $5/month ceiling, not a performance target ───────────────────
# This was shared-cpu-4x / 4GB / 25GB always-on — about $31/month, sized for
# L7.5's production bar ("a 60-minute source renders without OOM"). That is the
# right target for production and the wrong one for a product with no revenue
# and a $5 monthly allowance to stay inside.
#
#   cpu/mem   performance-1x, 2GB (was shared-cpu-1x/1GB — see the [[vm]] block
#             below for the steal-time measurement that forced the change).
#   volume    3GB. Holds one source plus its intermediates. Volumes GROW but
#             never shrink, so starting small is the only reversible direction.
#   jobs      MAX_CONCURRENT_JOBS=1. Two renders in 1GB is an OOM, and the OOM
#             killer takes both.
#
# Before production, reverse all three. It is a config change and a redeploy,
# not a rewrite — and L7.5 stays open until it is done.

# ── Why it DOES now scale to zero ──────────────────────────────────────────
# This previously said min_machines_running = 1 was load-bearing, because the
# worker runs a polling loop and a reaper, and sleeping stops both. That
# argument is still correct — for production.
#
# It is suspended here for cost, with eyes open. The app pings
# /webhook/job-submitted on every submission (worker-client.ts:29) and an
# inbound request wakes a stopped machine, so the normal path — submit, wake,
# process — works.
#
# What is genuinely lost: a job that appears WITHOUT a webhook (a retry, or a
# row written directly) waits until something else wakes the machine. And the
# clip-retention sweep only runs while awake. Both are acceptable while nobody
# is paying; neither is acceptable once somebody is.

app = "brandosse-video-worker"
# lhr, because Supabase for this project is in AWS eu-west-1 (Ireland) —
# confirmed from supabase/.temp/pooler-url: aws-1-eu-west-1.pooler.supabase.com.
# Fly has no Dublin region, and London is the nearest. This is the region that
# matters: every rendered clip is uploaded to Supabase Storage and every stage
# writes job progress to Postgres, so worker-to-database latency dominates,
# not worker-to-user. A volume cannot be moved between regions afterwards.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly injects PORT; main.py:190 reads it and falls back to WORKER_PORT.
  WORKER_PORT = "8001"
  # Points at the mounted volume below rather than the machine's rootfs.
  WORKER_TEMP_DIR = "/data/video-engine"
  WORKER_LOG_LEVEL = "INFO"
  # Two at a time is what the memory budget above is sized for. Raising this
  # without raising memory is how you get an OOM under load rather than a queue.
  WORKER_MAX_CONCURRENT_JOBS = "1"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # See "Why it never scales to zero" above. This is load-bearing.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # The HTTP surface is a webhook and a health check. Real work happens in the
    # polling loop, so request concurrency is not the thing to tune.
    soft_limit = 20
    hard_limit = 40

# Fly's own check, independent of the app's polling loop, so a wedged worker is
# visible as unhealthy rather than merely quiet.
[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

# ── Sizing: a DEDICATED core, because the shared one was being taken away ──
#
# This was shared-cpu-1x/1GB to sit inside a $5/month allowance. It worked for
# short sources and failed for real ones: a 20-minute video took 36.8 minutes
# and lost 2 of 5 clips to render timeouts.
#
# The cause was not the code. /proc/stat on the running worker, 2026-08-24:
#
#     user 1056 | system 176 | idle 5246 | steal 10824
#
# Steal time ~9x the time we actually got to compute — the hypervisor handing
# our core to other tenants. shared-cpu-* is burstable, and sustained video
# encoding is exactly the workload that exhausts a burst allowance and then
# crawls. The same crop+scale+encode measured 0.5x realtime with CPU available
# and 4.9x while starved, same code and same day, which is why clips timed out
# unpredictably rather than consistently.
#
# performance-1x is a dedicated core: no steal, and 2GB instead of 1GB, which
# also removes the OOM risk that forced MAX_CONCURRENT_JOBS=1.
#
# On cost: billing is per SECOND and this app still scales to zero. A machine
# that renders several times faster runs proportionally fewer seconds, so the
# cost per job stays close while wall-clock drops sharply. The exposure is idle
# time, and there is none while min_machines_running = 0.
[[vm]]
  size = "performance-1x"
  memory = "2gb"

# Scratch space for downloads, extracted audio and rendered clips. Nothing here
# is durable state — the job record lives in Postgres and finished clips go to
# Supabase Storage — but it must hold one source plus its intermediates while
# they are being worked on.
#
# 3GB, down from 25GB. At $0.15/GB/month that is $0.45 instead of $3.75, and
# 25GB of provisioned-but-empty disk is billed exactly the same as 25GB of full
# one. Sized for one short source at a time, matching MAX_CONCURRENT_JOBS=1.
#
# Volumes GROW but never shrink, so small is the only reversible direction:
# `fly volumes extend` raises it on demand, nothing lowers it.
[[mounts]]
  source = "video_worker_data"
  destination = "/data"
  initial_size = "3gb"
