name: CI

# LOCK L0.1 / L0.5 / L0.7 — this workflow previously ran a BUILD ONLY.
#
# The repo had eight purpose-written guard scripts and one Playwright spec, and
# none of them executed anywhere. Four of the eight had been failing for months
# (pointing at files deleted during the ui-v2 migration) and nobody knew,
# because a check that never runs cannot fail loudly. The launch audit called
# this verification theatre; this workflow is the fix.
#
# Job split is deliberate:
#   - `guards` and `build` are hermetic (no live database) so every PR gets
#     fast, safe feedback.
#   - `live-invariants` touches the production database and therefore runs on a
#     schedule and on demand, NOT on every PR. Its probes are read-only on PRs
#     by construction (--read-only); the scheduled run does the full check
#     including the write probes that self-revert.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 UTC daily — catches drift that no code change would reveal, which is
    # how the RLS gap, the frozen posts, and the fabricated-data job all
    # persisted unnoticed for months.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # ── Hermetic checks — no secrets, no network, every PR ─────────────────────
  guards:
    name: Guard scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # secret-scan uses `git ls-files`; a shallow clone is fine, but the
          # full working tree must be present.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 22). CI on a different major than the
          # one the code is written against is the same class of mismatch that
          # let `npm ci` stay broken on Linux while passing on Windows.
          # actions/*@v4 also emit a Node-20 deprecation warning.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # LOCK L0.5 — no live credential may enter a tracked file. The live
      # webhook secret sat in a docs/ markdown file from the first commit.
      - name: Secret scan
        run: node scripts/security/secret-scan.mjs

      # LOCK L1.6 — signed OAuth state. Asserts a forged state naming another
      # user is rejected. Hermetic: no network.
      - name: OAuth state guard
        run: node scripts/security/oauth-state.test.mjs
        env:
          # Any 32+ char value works; this test only needs a signing key and
          # deliberately never touches the real one. The value is worded to read
          # as an obvious placeholder so the secret scanner above does not flag
          # this very file — which it did, correctly, on the first attempt.
          OAUTH_STATE_SECRET: ci-placeholder-oauth-signing-key-for-tests-only

      # Deno is needed by the token custody guard below, which round-trips
      # ciphertext between the Node and Deno implementations. Without it that
      # check SKIPS rather than fails, which would quietly leave the twin files
      # unguarded — the exact "a check that never runs cannot fail loudly"
      # problem this whole workflow was written to end.
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # Defect D1 — platform token custody. connected_accounts grants SELECT to
      # `authenticated`, and RLS filters rows rather than columns, so a stored
      # plaintext token would be readable from the browser by its own owner and
      # harvestable by any XSS. Asserts tokens are encrypted with a fresh IV per
      # write, that tampering is detected rather than silently tolerated, and —
      # most importantly — that a missing key REFUSES rather than degrading to
      # plaintext.
      #
      # Also proves CROSS-RUNTIME INTEROP: tokens are encrypted by Next.js API
      # routes (Node) and decrypted by the publish adapter (Deno edge function),
      # from two separate files. Drift between them would not be cosmetic — every
      # stored token would become permanently undecryptable, and the symptom
      # would look like a platform auth error rather than our bug.
      #
      # Hermetic: generates its own key, no network.
      - name: Token custody guard
        run: node scripts/security/token-crypto.test.mjs

      # The other half of D1. Moving credentials out of connected_accounts also
      # revoked client write access to access_token/refresh_token/mock_token —
      # and three client paths (disconnect, reconnect, mock connect) were still
      # writing them. All three started returning 403 the moment the migration
      # landed, and the first symptom was a user unable to remove an account.
      # tsc cannot see it: they are string keys in a PostgREST payload.
      - name: Revoked-column write guard
        run: node scripts/check-revoked-column-writes.cjs

      # TikTok makes specific UI elements a CONDITION of Direct Post approval,
      # and every violation looks like an improvement: pre-select Public,
      # comments on by default, only show the music notice when relevant,
      # tighten the legal wording. None of those fail a test, a type-check or a
      # normal review — they fail an audit weeks later with a generic rejection
      # email, costing a full review cycle.
      - name: TikTok UX compliance guard
        run: node scripts/check-tiktok-ux-compliance.cjs

      # A post reached YouTube on 2026-09-11 with generation_id = NULL and
      # failed 14 seconds later: "YouTube requires a video. This post has no
      # media attached." 83 of 128 drafts carried no media link at all. Nothing
      # computed a wrong answer — the platform's requirement was simply never
      # connected to the button that submits. This asserts that connection, and
      # that the frontend's requiresMedia flags still mirror the adapters which
      # actually enforce them.
      - name: Media-required composer guard
        run: node scripts/check-media-required-guard.cjs

      # Phase 2 (composer). The sibling of the guard above: that one asserts a
      # post cannot reach a media-mandatory platform with no media, this one
      # asserts it cannot reach a platform that hard-refuses missing per-post
      # settings without them. Both are the same defect class — a requirement
      # enforced at one end and never collected at the other. Found live: every
      # TikTok post the composer created was refused at publish because
      # workflow_state was written for YouTube only.
      - name: Composer field contract
        run: node scripts/check-composer-field-contract.cjs

      # Phase 3 (schedule). The picker's rules — seeding, the floor, and DST —
      # as a unit test, because they are arithmetic and a browser cannot show
      # you that a post moved an hour. Found a real bug in zonedDateTimeToUTC:
      # it sampled the UTC offset at the wrong instant, so every DST-observing
      # user's scheduled posts were an hour out, twice a year.
      - name: Schedule seeding and floor
        run: node scripts/test/schedule-seed.test.mjs

      # Phase 3's reaper coverage. "Every non-terminal state needs a reaper" was
      # a rule that was half-kept: `publishing` had one, `scheduled` did not, so
      # a post that was due and simply never sent sat pending forever. This also
      # pins the decision that the overdue alarm REPORTS rather than auto-fails —
      # auto-failing a stopped dispatcher would destroy recoverable content.
      - name: Non-terminal state reapers
        run: node scripts/check-nonterminal-state-reapers.cjs

      # Phase 4 (receipt). The rule the 2026-09-11 defect broke, stated once and
      # checked exhaustively: a headline may claim success ONLY when every
      # destination actually published. The generated sweep caught a real hole —
      # `failed === 0` reported three drafts as "Published to 0 accounts".
      - name: Publish outcome honesty
        run: node scripts/test/publish-outcome.test.mjs

      # …and that a send always reaches that receipt. Before it, a publish ended
      # in a toast on the grid, where a half-succeeded multi-destination send
      # looked identical to a clean one, and the live post URL the adapter
      # records was read by nothing at all.
      - name: Publish receipt wiring
        run: node scripts/check-publish-receipt.cjs

      # Phases 5 and 6. The score is a paid LLM call behind a rate limit, so the
      # failure to prevent is not a wrong number but a composer that cannot send
      # because an OPTIONAL one did not arrive — it would block hardest exactly
      # when the provider is down. And every caption-fold figure is observed
      # behaviour, not a published API value, so each must carry its grade and
      # source in one table rather than drifting across two.
      - name: Discovery score and fold maths
        run: node scripts/test/discovery-and-preview.test.mjs
      - name: Discovery and preview contract
        run: node scripts/check-discovery-preview-contract.cjs

      # The copy review report, frozen at publish. The test imports the client
      # AND the Deno fingerprint modules and fails if they diverge — drift would
      # make every composer review look stale and the worker pay to re-score
      # every published post while reporting nothing wrong. The contract checks
      # that only the worker freezes a report, conditionally, on a schedule.
      - name: Copy review report
        run: node scripts/test/copy-review.test.mjs
      - name: Copy review contract
        run: node scripts/check-copy-review-contract.cjs

      # A calendar component mounted outside the Calendar must bring its own
      # stylesheet. The composer did not: opened from a fresh Library load it
      # rendered as an unstyled form below the grid, invisible to `next build`
      # and to an E2E whose toBeVisible is true for unstyled elements.
      - name: Calendar components own their styles
        run: node scripts/check-composer-styles-owned.cjs

      # LOCK L0.7 — the eight guard scripts that existed and never ran.
      # Later locks append their own below; all of them are blocking.
      - name: check-env-security
        run: node scripts/check-env-security.cjs
      - name: check-status-literals
        run: node scripts/check-status-literals.cjs
      - name: check-edge-functions
        run: node scripts/check-edge-functions.cjs
      - name: check-production-workflow
        run: node scripts/check-production-workflow.cjs
      - name: check-docs-canonical
        run: node scripts/check-docs-canonical.cjs
      - name: publishability-gates
        # The Library may not offer Publish on an asset the publisher cannot
        # resolve media for. That is the 2026-09-11 defect: a YouTube post that
        # failed fourteen seconds after creation with no media attached.
        # 36 checks plus 432 generated cases holding the invariant.
        run: node scripts/test/publishability.test.mjs
      - name: check-uiv2-token-definitions
        # A --uiv2-* token that is never defined does not error — the fallback
        # wins forever and the element stops following the theme. Six were live
        # on 2026-09-13, four of them in the TikTok and YouTube publishing
        # panels, all with dark fallbacks that painted black on a light page.
        run: node scripts/check-uiv2-token-definitions.cjs
      - name: check-ui-consistency
        # The ratchet reached the top on 2026-09-13: the whole src/ tree is
        # enforced. It started at 254 reported-but-ignored findings and six
        # cleared paths; every enforceable bucket is now zero — no raw colours,
        # no generic global selectors, no missing alt, no unlabelled icon
        # buttons. Token DEFINITIONS stay advisory by design: defining a colour
        # in a palette is the thing we want, and only using a literal at the
        # point of use is the defect.
        #
        # If this fails, it found something real. Fix it rather than narrowing
        # the path list — a check that reports and passes anyway is the failure
        # mode this replaced.
        env:
          UI_CONSISTENCY_STRICT_PATHS: src
        run: node scripts/check-ui-consistency.cjs
      # The six published legal documents: no template placeholder or draft
      # banner reaches production, every incorporation by reference resolves,
      # and the signup form links to the contract it makes users accept.
      - name: check-legal-pages
        run: node scripts/check-legal-pages.cjs
      - name: check-e2e-env
        run: node scripts/check-e2e-env.cjs
      - name: check-production-ready
        run: node scripts/check-production-ready.cjs

      # LOCK L5.15 — the first-run surface: what a brand-new account is shown,
      # and whether the signup page tells it the truth about its credits.
      - name: check-empty-states
        run: node scripts/check-empty-states.cjs
      - name: check-credit-grant
        run: node scripts/check-credit-grant.cjs
      - name: check-video-prefs-contract
        run: node scripts/check-video-prefs-contract.cjs
      - name: check-metadata-format-decoupling
        run: node scripts/check-metadata-format-decoupling.cjs
      # The user's real logo sat in their Brand Kit and reached no image: the
      # compositor worked, but nothing ever passed it a logo. Guards the whole
      # chain (settings -> store -> service -> edge -> raster -> composite)
      # plus loud failure, so it cannot silently disconnect again.
      - name: check-brand-logo-chain
        run: node scripts/check-brand-logo-chain.cjs
      # A real generation failed and told the user nothing: a 20-word caption
      # floor was applied to an X post, and the collected failure reasons were
      # discarded. Keeps both fixed and keeps the misleading "CORS" symptom
      # from becoming a real CORS bug.
      - name: check-generation-diagnosability
        run: node scripts/check-generation-diagnosability.cjs

      # extractBrandKit fetched body.websiteUrl, and generateImage fetched
      # body.logo_url, straight from the request with no address validation and
      # redirect:follow — SSRF with the reply delivered back through the product's
      # own UI. Both now route through _shared/safeFetch.ts. This keeps any new
      # caller-influenced fetch from shipping unvalidated.
      - name: check-outbound-fetch-guard
        run: node scripts/check-outbound-fetch-guard.cjs

      - name: check-oauth-provider-parity
        run: node scripts/check-oauth-provider-parity.cjs
      # OAuth scopes are fixed at consent. A scope missing from the authorize
      # request cannot be added later for accounts that already connected —
      # every one of those users has to disconnect and reconnect. So the scope
      # set is asserted before anyone connects, not checked after.
      - name: check-oauth-scope-coverage
        run: node scripts/check-oauth-scope-coverage.cjs
      # "Connected but cannot publish" is this repo's signature defect, and it is
      # always a chain with a link missing in the middle: the UI offers a platform,
      # but discovery, the adapter, or the publish dispatch is absent. This walks
      # the whole chain for every platform the UI promises.
      - name: check-direct-oauth-wiring
        run: node scripts/check-direct-oauth-wiring.cjs
      # The guard above proves every risky fetch ROUTES THROUGH safeFetch. This
      # one proves safeFetch actually refuses things: metadata endpoints, every
      # private range, and the decimal/octal/hex/IPv4-mapped/NAT64/6to4
      # encodings used to smuggle a loopback address past a naive filter.
      - name: check-ssrf-blocklist
        run: node scripts/check-ssrf-blocklist.cjs
      # brand_kit.version_hash was btoa(JSON.stringify(row)).slice(0,16) — twelve
      # bytes of a row that always starts {"id":"<uuid>, so it was the kit's UUID
      # and never changed when the brand did. Every generation receipt carried a
      # brand version that was a constant. Asserts coverage against the real
      # columns AND that the hash actually moves when the brand does.
      - name: check-brand-version-hash
        run: node scripts/check-brand-version-hash.cjs
      # The design layer is jsonb. The database can check that a column holds an
      # object; it cannot check the object means anything. One writer, one shape,
      # plus the WCAG contrast maths every colour decision depends on.
      - name: check-brand-design-writer
        run: node scripts/check-brand-design-writer.cjs
      # CLAUDE.md requires migrations to be idempotent, transactional and to
      # assert their post-condition, and nothing verified any of it. Runs the
      # brand_kit chain against a real Postgres in Docker. It caught an ambiguous
      # column reference in 20260901120000 on its first use — that migration
      # would have failed on the production database.
      - name: check-migrations-apply
        run: node scripts/check-migrations-apply.cjs
      # The analytics schema needs a different stub set (connected_accounts,
      # posts, organization_members, the authenticated/anon roles), so it is a
      # sibling suite rather than a longer CHAIN above. It applies the migration
      # twice for idempotence and then proves each constraint actually REJECTS
      # bad data — a rejection cannot be tested from inside the migration,
      # because it would roll the migration back.
      - name: check-analytics-migration
        run: node scripts/check-analytics-migration.cjs
      # The website import used to hand marketing prose to an LLM and ask for a
      # colour palette; shown no colours, it produced colours anyway. The harvester
      # reads the site's own CSS instead. This asserts exact measured hexes against
      # a fixture whose right answers are known by construction — not merely that
      # "a palette was produced".
      - name: check-site-harvest
        run: node scripts/check-site-harvest.cjs
      # Text measurement is what every wrap, shrink and safe-area guarantee is
      # computed from. Asserted against real rendered ink, not against itself —
      # and specifically that predictions never run NARROW, since narrow means
      # text overflows the canvas.
      - name: check-font-metrics
        run: node scripts/check-font-metrics.cjs
      # The compositor was built, wired inside generateImage, and covered by two
      # passing guards — and never ran once, because nothing in the client sent
      # `compose.text`. A guard that proves a module WORKS is not a guard that
      # proves it is USED. This asserts the whole chain, every registration site.
      - name: check-compose-wiring
        run: node scripts/check-compose-wiring.cjs
      # --uiv2-accent-text was 3.94:1 on white in light theme, used 62 times as a
      # text colour. Nobody noticed for as long as the token existed, because
      # contrast is invisible to everyone who can already read it. It is
      # arithmetic, so it gets a guard rather than a reviewer.
      - name: check-token-contrast
        run: node scripts/check-token-contrast.cjs
      # The landing page defines its OWN --lp-* palette and uses zero --uiv2
      # tokens, so check-token-contrast could not see it and was green while
      # Lighthouse found 11 failing elements there — including the primary CTA
      # at 3.07:1. A guard that cannot see the surface proves nothing about it.
      - name: check-landing-contrast
        run: node scripts/check-landing-contrast.cjs
      # The URL import — the only path that MEASURES a brand rather than
      # inferring it — was reachable from the zero-kits landing screen only,
      # which a user sees once. Everyone with a kit already got a setup screen
      # that did not offer it.
      - name: check-website-import-reachable
        run: node scripts/check-website-import-reachable.cjs
      # deleteKit existed in the store, called by nothing, and with both bugs
      # that make kit deletion dangerous: no active-kit handover (leaving zero
      # active kits, so every later generation silently runs with no brand) and
      # no storage cleanup (row cascade is not file cleanup).
      - name: check-kit-deletion
        run: node scripts/check-kit-deletion.cjs
      # useAuthenticatedRedirect read localStorage during render, so the server
      # rendered the public page and the client rendered the redirect overlay —
      # a hydration mismatch on every public page a signed-in user opened. The
      # fix has two halves and the first alone left it intermittent.
      - name: check-ssr-hydration-safety
        run: node scripts/check-ssr-hydration-safety.cjs
      # The extraction screen showed timer-driven stages and a bar frozen at 30%
      # for the real 23s of work; StrictMode also left its cancelled flag stuck
      # true, so the finished response was discarded and the screen waited
      # forever — while billing for two extractions per import.
      - name: check-extract-progress-honesty
        run: node scripts/check-extract-progress-honesty.cjs
      # Three components each showed "AI inferred this — please verify" behind
      # `confidence === 'low'`, against a value the extractor has always sent as a
      # NUMBER. The flag had never rendered once. Also asserts the harvester's
      # measured design layer actually reaches the database instead of being
      # dropped one hop before it, and that both WCAG implementations agree.
      - name: check-brand-provenance
        run: node scripts/check-brand-provenance.cjs
      # A spike on 2026-09-02 established that resvg, given text and no font
      # buffer, renders ZERO pixels and throws nothing — a blank graphic that
      # reports success. This RENDERS every template against several palettes
      # (including a deliberately illegible one), asserts real ink, asserts
      # 4.5:1 on every drawn block, and asserts a missing font is refused.
      - name: check-compositor-fonts
        run: node scripts/check-compositor-fonts.cjs
      # The compositor's value holds only while the background is genuinely
      # text-free. Ideogram exists to draw text inside an image and must never be
      # selected here, and the no-text directive must be appended AFTER the
      # prompt enhancer or the enhancer paraphrases it away.
      - name: check-no-diffusion-text
        run: node scripts/check-no-diffusion-text.cjs

      # LOCK L-1.6 — "documentation is a claim" was the only law in CLAUDE.md
      # with no detector behind it. This checks the one claim docs make
      # mechanically: that the file they point at exists.
      - name: check-doc-citations
        run: node scripts/check-doc-citations.cjs

      # LOCK L7.1 — the repo must describe exactly one host. Two deploy
      # configs is how a service runs in two places and is debugged in a third.
      - name: check-single-deploy-target
        run: node scripts/check-single-deploy-target.cjs

      # LOCK L6.3 — every variable the code reads, across web/edge/worker, must
      # be written down in .env.example. Three were not, and all three were
      # already set in production — so nothing was broken, and nobody setting up
      # a fresh environment could have known to set them.
      - name: check-env-contract
        run: node scripts/check-env-contract.cjs

      # LOCK L5.6 / L5.7 — the app chrome has one definition. Ten pages had
      # each hand-written the header block and nine had each declared the nav;
      # both sets had already drifted (Analytics missing from five navs,
      # Billing's credit meter pinned to 100%). Neither lock had a detector,
      # which is why the duplication survived the lock that "fixed" it.
      - name: check-app-shell
        run: node scripts/check-app-shell.cjs

      # LOCK L5.6 — ui-v2 must not inherit v1's look. This guard existed but
      # ran nowhere and had been failing for six imports; it now enforces the
      # rule README.md actually states (no old presentation) rather than a
      # stricter one nothing could satisfy.
      - name: check-ui-v2-isolation
        run: node scripts/check-ui-v2-isolation.cjs

      # LOCK L2.5 — the dashboard's status summary must account for every post.
      # It counted four of six statuses, so a user with 110 posts was shown 107
      # and never learned three were stuck mid-publish.
      - name: check-post-status-accounting
        run: node scripts/check-post-status-accounting.cjs

      # LOCK L5.3a. Clip analysis ran at max_tokens=4096 and parsed the response
      # without checking stop_reason, so a long source produced a truncated clip
      # list that either failed with a misleading "invalid JSON" or — worse —
      # parsed cleanly and shipped a job that had silently lost real moments.
      - name: check-llm-truncation
        run: node scripts/check-llm-truncation.cjs

      # A deployment that cannot state which commit it is running turns every
      # "is this live?" question into detective work. On 2026-09-01 a timestamp
      # comparison wrongly reported a security fix as undeployed, and only a
      # behavioural probe disproved it.
      - name: check-deploy-version-signal
        run: node scripts/check-deploy-version-signal.cjs

      # The brand kit must be LOADED by user_id, never accepted from the request
      # body. Eight edge functions were taking it from the body and using it as
      # the authenticated user's brand — arbitrary caller-controlled text. Fine
      # while it only reached prompt strings; client-controlled spend the moment
      # any kit value influences model routing or credit tier.
      - name: check-brand-kit-trust
        run: node scripts/check-brand-kit-trust.cjs

      # LOCK L5.14. A provider call that is not recorded in the cost ledger is
      # invisible to every cost control in the system — the retry multiplier,
      # per-user spend ceilings, real COGS per delivered video, price-drift
      # detection and invoice reconciliation all read that one table.
      - name: check-cost-ledger
        run: node scripts/check-cost-ledger.cjs

  # ── Edge function type check ──────────────────────────────────────────────
  # The edge functions are TypeScript that has never been type-checked: the
  # lockdown plan lists "the first real Deno type-check" as an outstanding
  # founder-side item. Nothing in CI or on a developer machine compiles them, so
  # a type error ships and is discovered by a 500 in production.
  edge-typecheck:
    name: Edge function type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: deno check
        run: deno check supabase/functions/**/index.ts supabase/functions/_shared/*.ts

      # Unit tests for the pure logic in the edge adapters. Runs with
      # --no-check because `deno check` above is the type gate; without it, the
      # 81 pre-existing errors in other files would stop these tests running at
      # all, which is how a passing suite gets silently switched off.
      #
      # These caught a real defect on their first run: a null in a post's tag
      # array became the literal tag "null" on the user's video, because
      # String(null) is truthy and survived .filter(Boolean).
      - name: deno test (edge adapters)
        run: deno test --no-check supabase/functions/_shared/*.test.ts

  # ── Worker unit tests ─────────────────────────────────────────────────────
  # The Python worker had no test job at all. `_repair_cookie_newlines` was
  # described in the lockdown plan as "unit-tested four ways", but no test file
  # was ever committed — the tests existed only in someone's terminal, which is
  # the same as not existing. This job is where worker tests run from now on.
  #
  # Deliberately stdlib-only: the tests stub `database` and `logger` so no
  # dependency install, no network and no credentials are needed, which keeps
  # this job fast enough to run on every PR.
  worker-tests:
    name: Worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LOCK — brand screening of hook titles. An LLM writes the hook text and
      # the worker burns it into H.264; nothing checked it against the user's
      # own forbidden_phrases until 2026-08-31. Burned-in pixels cannot be
      # corrected without a paid re-render, so this must not regress.
      - name: brand screening
        run: python video-worker/tests/test_brand_screening.py

      - name: worker modules compile
        run: python -m compileall -q video-worker/stages video-worker/utils video-worker/brand_kit.py

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 22). CI on a different major than the
          # one the code is written against is the same class of mismatch that
          # let `npm ci` stay broken on Linux while passing on Windows.
          # actions/*@v4 also emit a Node-20 deprecation warning.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build:webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # Server-only — placeholders are fine here; real values live in Vercel.
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          FAL_API_KEY: ci-placeholder
          OAUTH_STATE_SECRET: ci-placeholder-32-chars-xxxxxxxxxx
          CRON_SECRET: ci-placeholder
          VIDEO_WORKER_WEBHOOK_SECRET: ci-placeholder
          WORKER_WEBHOOK_URL: http://localhost:8001

      # The legal-page checks that can only run against BUILT html. The
      # hermetic `guards` job reads source, which cannot see a space JSX
      # dropped between a link and the word after it — that shipped once.
      # --require-build turns "no build found" from a skip into a failure, so
      # this step cannot silently pass by finding nothing to check.
      - name: check-legal-pages (rendered output)
        run: node scripts/check-legal-pages.cjs --require-build

  # ── End-to-end — the suite that had never run in CI at all ─────────────────
  e2e:
    name: End-to-end
    # LOCK L6.2. Eighteen Playwright tests existed and CI ran none of them, so
    # four had been failing for months against markup deleted in the ui-v2
    # migration and nobody could have known. That is the same shape as the cron
    # allowlist, the four dead guard scripts, and `npm ci` red on main:
    # verification nobody watches decays to zero.
    #
    # Scheduled and manual only, like live-invariants. The first-run tests
    # REGISTER REAL ACCOUNTS against production — that is the only way to see
    # what a new user sees — and doing that on every PR would be reckless. They
    # clean up after themselves; a leftover is named ttfv+* or wprobe-*.
    #
    # E2E_RUN_GENERATION stays unset: the opt-in tests spend real money at
    # fal.ai, and are for a human to run deliberately.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build:webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          FAL_API_KEY: ci-placeholder
          OAUTH_STATE_SECRET: ci-placeholder-32-chars-xxxxxxxxxx
          CRON_SECRET: ci-placeholder
          VIDEO_WORKER_WEBHOOK_SECRET: ci-placeholder
          WORKER_WEBHOOK_URL: http://localhost:8001
      # The specs read .env.local directly, because the Playwright runner only
      # forwards the server's environment to `next start`, not to the tests.
      - name: Materialise probe environment
        run: |
          cat > .env.local <<'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL=${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD=${{ secrets.E2E_USER_PASSWORD }}
          ENVEOF
      - name: Playwright
        run: npm run test:e2e:chromium
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Remove probe environment
        if: always()
        run: rm -f .env.local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  # ── Live invariants — touches production, so NOT on every PR ───────────────
  live-invariants:
    name: Live invariants
    # Scheduled and manual only. Running write probes against production on
    # every PR would be reckless; running them never is how the cross-tenant
    # leak survived. Daily is the compromise.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 22). CI on a different major than the
          # one the code is written against is the same class of mismatch that
          # let `npm ci` stay broken on Linux while passing on Windows.
          # actions/*@v4 also emit a Node-20 deprecation warning.
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # The probes read .env.local, so materialise one from CI secrets. It is
      # gitignored and lives only for the life of the runner.
      - name: Materialise probe environment
        run: |
          cat > .env.local <<'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL=${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD=${{ secrets.E2E_USER_PASSWORD }}
          ENVEOF

      # LOCK L1.1 / L1.5 — the highest-value check in the repository. Logs in as
      # an ordinary non-admin user with the PUBLIC anon key and asserts it can
      # read nothing it does not own, and cannot promote itself.
      - name: Cross-tenant isolation
        run: node scripts/security/cross-tenant-probe.mjs

      # LOCK L6.4 — the other half of tenant isolation. The read probe above
      # proves nobody can SEE another account; this proves nobody can CHANGE
      # one. Separate RLS policies, separate verdicts. It registers two
      # throwaway accounts and attacks one from the other, so a leak damages
      # nothing real, and deletes both afterwards.
      - name: Cross-tenant writes
        run: node scripts/security/cross-tenant-write-probe.mjs

      # LOCK L6.3 — which edge functions answer without a JWT. There was no
      # config.toml at all, so the setting was whatever the CLI defaulted to on
      # the day each was deployed. Fails both ways: an unlisted function that
      # answers is an exposure, a listed one that refuses is a dead integration.
      - name: Edge function auth
        run: node scripts/security/edge-auth-probe.mjs

      # LOCK L2.3 — no record may sit in a non-terminal state past its timeout.
      # 20 posts were frozen for up to 139 days before the reaper existed.
      - name: Stuck records
        run: node scripts/security/stuck-records-probe.mjs

      - name: Remove probe environment
        if: always()
        run: rm -f .env.local
