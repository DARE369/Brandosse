name: CI

# LOCK L0.1 / L0.5 / L0.7 — this workflow previously ran a BUILD ONLY.
#
# The repo had eight purpose-written guard scripts and one Playwright spec, and
# none of them executed anywhere. Four of the eight had been failing for months
# (pointing at files deleted during the ui-v2 migration) and nobody knew,
# because a check that never runs cannot fail loudly. The launch audit called
# this verification theatre; this workflow is the fix.
#
# Job split is deliberate:
#   - `guards` and `build` are hermetic (no live database) so every PR gets
#     fast, safe feedback.
#   - `live-invariants` touches the production database and therefore runs on a
#     schedule and on demand, NOT on every PR. Its probes are read-only on PRs
#     by construction (--read-only); the scheduled run does the full check
#     including the write probes that self-revert.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 UTC daily — catches drift that no code change would reveal, which is
    # how the RLS gap, the frozen posts, and the fabricated-data job all
    # persisted unnoticed for months.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # ── Hermetic checks — no secrets, no network, every PR ─────────────────────
  guards:
    name: Guard scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # secret-scan uses `git ls-files`; a shallow clone is fine, but the
          # full working tree must be present.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 22). CI on a different major than the
          # one the code is written against is the same class of mismatch that
          # let `npm ci` stay broken on Linux while passing on Windows.
          # actions/*@v4 also emit a Node-20 deprecation warning.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # LOCK L0.5 — no live credential may enter a tracked file. The live
      # webhook secret sat in a docs/ markdown file from the first commit.
      - name: Secret scan
        run: node scripts/security/secret-scan.mjs

      # LOCK L1.6 — signed OAuth state. Asserts a forged state naming another
      # user is rejected. Hermetic: no network.
      - name: OAuth state guard
        run: node scripts/security/oauth-state.test.mjs
        env:
          # Any 32+ char value works; this test only needs a signing key and
          # deliberately never touches the real one. The value is worded to read
          # as an obvious placeholder so the secret scanner above does not flag
          # this very file — which it did, correctly, on the first attempt.
          OAUTH_STATE_SECRET: ci-placeholder-oauth-signing-key-for-tests-only

      # LOCK L0.7 — the eight guard scripts that existed and never ran.
      # Later locks append their own below; all of them are blocking.
      - name: check-env-security
        run: node scripts/check-env-security.cjs
      - name: check-status-literals
        run: node scripts/check-status-literals.cjs
      - name: check-edge-functions
        run: node scripts/check-edge-functions.cjs
      - name: check-production-workflow
        run: node scripts/check-production-workflow.cjs
      - name: check-docs-canonical
        run: node scripts/check-docs-canonical.cjs
      - name: check-ui-consistency
        run: node scripts/check-ui-consistency.cjs
      - name: check-e2e-env
        run: node scripts/check-e2e-env.cjs
      - name: check-production-ready
        run: node scripts/check-production-ready.cjs

      # LOCK L5.15 — the first-run surface: what a brand-new account is shown,
      # and whether the signup page tells it the truth about its credits.
      - name: check-empty-states
        run: node scripts/check-empty-states.cjs
      - name: check-credit-grant
        run: node scripts/check-credit-grant.cjs
      - name: check-video-prefs-contract
        run: node scripts/check-video-prefs-contract.cjs
      - name: check-metadata-format-decoupling
        run: node scripts/check-metadata-format-decoupling.cjs

      # LOCK L-1.6 — "documentation is a claim" was the only law in CLAUDE.md
      # with no detector behind it. This checks the one claim docs make
      # mechanically: that the file they point at exists.
      - name: check-doc-citations
        run: node scripts/check-doc-citations.cjs

      # LOCK L7.1 — the repo must describe exactly one host. Two deploy
      # configs is how a service runs in two places and is debugged in a third.
      - name: check-single-deploy-target
        run: node scripts/check-single-deploy-target.cjs

      # LOCK L6.3 — every variable the code reads, across web/edge/worker, must
      # be written down in .env.example. Three were not, and all three were
      # already set in production — so nothing was broken, and nobody setting up
      # a fresh environment could have known to set them.
      - name: check-env-contract
        run: node scripts/check-env-contract.cjs

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 22). CI on a different major than the
          # one the code is written against is the same class of mismatch that
          # let `npm ci` stay broken on Linux while passing on Windows.
          # actions/*@v4 also emit a Node-20 deprecation warning.
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build:webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # Server-only — placeholders are fine here; real values live in Vercel.
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          FAL_API_KEY: ci-placeholder
          OAUTH_STATE_SECRET: ci-placeholder-32-chars-xxxxxxxxxx
          CRON_SECRET: ci-placeholder
          VIDEO_WORKER_WEBHOOK_SECRET: ci-placeholder
          WORKER_WEBHOOK_URL: http://localhost:8001

  # ── End-to-end — the suite that had never run in CI at all ─────────────────
  e2e:
    name: End-to-end
    # LOCK L6.2. Eighteen Playwright tests existed and CI ran none of them, so
    # four had been failing for months against markup deleted in the ui-v2
    # migration and nobody could have known. That is the same shape as the cron
    # allowlist, the four dead guard scripts, and `npm ci` red on main:
    # verification nobody watches decays to zero.
    #
    # Scheduled and manual only, like live-invariants. The first-run tests
    # REGISTER REAL ACCOUNTS against production — that is the only way to see
    # what a new user sees — and doing that on every PR would be reckless. They
    # clean up after themselves; a leftover is named ttfv+* or wprobe-*.
    #
    # E2E_RUN_GENERATION stays unset: the opt-in tests spend real money at
    # fal.ai, and are for a human to run deliberately.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build:webpack
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          FAL_API_KEY: ci-placeholder
          OAUTH_STATE_SECRET: ci-placeholder-32-chars-xxxxxxxxxx
          CRON_SECRET: ci-placeholder
          VIDEO_WORKER_WEBHOOK_SECRET: ci-placeholder
          WORKER_WEBHOOK_URL: http://localhost:8001
      # The specs read .env.local directly, because the Playwright runner only
      # forwards the server's environment to `next start`, not to the tests.
      - name: Materialise probe environment
        run: |
          cat > .env.local <<'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL=${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD=${{ secrets.E2E_USER_PASSWORD }}
          ENVEOF
      - name: Playwright
        run: npm run test:e2e:chromium
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Remove probe environment
        if: always()
        run: rm -f .env.local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  # ── Live invariants — touches production, so NOT on every PR ───────────────
  live-invariants:
    name: Live invariants
    # Scheduled and manual only. Running write probes against production on
    # every PR would be reckless; running them never is how the cross-tenant
    # leak survived. Daily is the compromise.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local development (Node 22). CI on a different major than the
          # one the code is written against is the same class of mismatch that
          # let `npm ci` stay broken on Linux while passing on Windows.
          # actions/*@v4 also emit a Node-20 deprecation warning.
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # The probes read .env.local, so materialise one from CI secrets. It is
      # gitignored and lives only for the life of the runner.
      - name: Materialise probe environment
        run: |
          cat > .env.local <<'ENVEOF'
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL=${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD=${{ secrets.E2E_USER_PASSWORD }}
          ENVEOF

      # LOCK L1.1 / L1.5 — the highest-value check in the repository. Logs in as
      # an ordinary non-admin user with the PUBLIC anon key and asserts it can
      # read nothing it does not own, and cannot promote itself.
      - name: Cross-tenant isolation
        run: node scripts/security/cross-tenant-probe.mjs

      # LOCK L6.4 — the other half of tenant isolation. The read probe above
      # proves nobody can SEE another account; this proves nobody can CHANGE
      # one. Separate RLS policies, separate verdicts. It registers two
      # throwaway accounts and attacks one from the other, so a leak damages
      # nothing real, and deletes both afterwards.
      - name: Cross-tenant writes
        run: node scripts/security/cross-tenant-write-probe.mjs

      # LOCK L6.3 — which edge functions answer without a JWT. There was no
      # config.toml at all, so the setting was whatever the CLI defaulted to on
      # the day each was deployed. Fails both ways: an unlisted function that
      # answers is an exposure, a listed one that refuses is a dead integration.
      - name: Edge function auth
        run: node scripts/security/edge-auth-probe.mjs

      # LOCK L2.3 — no record may sit in a non-terminal state past its timeout.
      # 20 posts were frozen for up to 139 days before the reaper existed.
      - name: Stuck records
        run: node scripts/security/stuck-records-probe.mjs

      - name: Remove probe environment
        if: always()
        run: rm -f .env.local
